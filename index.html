<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeBuy AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f9;
  color: #102a43;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  background: white;
  padding: 25px;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.logo span {
  color: #2f9e44;
}

.hero {
  text-align: center;
  padding-top: 50px;
}

.house {
  font-size: 70px;
}

h1 {
  font-size: 34px;
}

p {
  color: #627d98;
  line-height: 1.5;
}

.card {
  background: #f5f8fb;
  padding: 18px;
  border-radius: 16px;
  margin-top: 15px;
  text-align: left;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border-radius: 14px;
  border: none;
  background: #102a43;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.option {
  background: white;
  color: #102a43;
  border: 1px solid #d9e2ec;
  text-align: left;
}

.ai {
  background: #f5f8fb;
  padding: 16px;
  border-radius: 16px;
  margin: 20px 0;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
HomeBuy <span>AI</span>
</div>

<div id="screen"></div>

</div>

<script>

var screen = document.getElementById("screen");

function welcome() {

screen.innerHTML = `
<div class="hero">

<div class="house">🏠</div>

<h1>Your Home Journey Starts Here.</h1>

<p>
Buying a home shouldn't feel like guessing.
HomeBuy AI helps you understand what home
actually makes sense for your life.
</p>

<div class="card">
<strong>🏠 Know Your Number</strong>
<p>
Understand what you can comfortably afford,
not just what you may qualify for.
</p>
</div>

<div class="card">
<strong>💰 Find Opportunities</strong>
<p>
Discover programs and benefits you may be
able to take advantage of.
</p>
</div>

<div class="card">
<strong>🤝 Stay In Control</strong>
<p>
AI advises. You make the decision.
</p>
</div>

<button onclick="startAdvisor()">
Let's Get Started →
</button>

</div>
`;

}

function startAdvisor() {

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI Advisor</strong>

<br><br>

Hey! I'm your HomeBuy AI Advisor.

<br><br>

Before we start talking about houses,
I want to learn a little about you.

<br><br>

I'm not here to tell you what you
<strong>want</strong> to hear.

<br><br>

I'm here to help you understand what
you <strong>need</strong> to know.

</div>

<h2>Have you owned a home before?</h2>

<button class="option" onclick="answer('First-time homebuyer')">
🏠 I'm a first-time homebuyer
</button>

<button class="option" onclick="answer('Current homeowner')">
🏡 I currently own a home
</button>

<button class="option" onclick="answer('Multiple properties')">
🏘️ I own multiple properties
</button>

<button class="option" onclick="answer('Investment')">
💰 I'm buying primarily as an investment
</button>

<button class="option" onclick="answer('Not sure')">
🤷 I'm not sure yet
</button>

`;

}

function answer(choice) {

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI</strong>

<br><br>

Got it. You selected:

<strong>${choice}</strong>

<br><br>

That's helpful.

I’m going to use that information as
we build your homebuyer profile.

</div>

<h2>Do you have military service?</h2>

<p>
I ask because military service may give you
access to benefits that other buyers don't have.
</p>

<button onclick="military('Yes')">
🇺🇸 Yes
</button>

<button onclick="military('No')">
No
</button>

<button onclick="military('Not sure')">
I'm not sure
</button>

`;

}

function military(choice) {

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI</strong>

<br><br>

Thanks. I'll keep that in mind.

<br><br>

Next, I want to understand where you're
planning to buy because location can affect
taxes, insurance, and available programs.

</div>

<h2>Where are you looking to buy?</h2>

<input
id="location"
placeholder="City, State or ZIP"
style="
width:100%;
padding:15px;
font-size:16px;
border:1px solid #d9e2ec;
border-radius:12px;
box-sizing:border-box;
">

<button onclick="locationNext()">
Continue →
</button>

`;

}

function locationNext() {

var location =
document.getElementById("location").value;

if (location.trim() === "") {

alert("Tell me where you're thinking about buying.");

return;

}

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI</strong>

<br><br>

Perfect. We're starting to build your profile.

<br><br>

<strong>${location}</strong>

<br><br>

Now let's talk about the part that matters most:

<strong>what you can comfortably afford.</strong>

</div>

<h2>What is your annual household income?</h2>

<input
id="income"
type="number"
placeholder="Example: 82000"
style="
width:100%;
padding:15px;
font-size:16px;
border:1px solid #d9e2ec;
border-radius:12px;
box-sizing:border-box;
">

<button onclick="incomeNext()">
Continue →
</button>

`;

}

function incomeNext() {

var income =
document.getElementById("income").value;

if (income === "" || Number(income) <= 0) {

alert("Enter your annual household income.");

return;

}

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI</strong>

<br><br>

Okay. I have your income.

<br><br>

But here's something important:

<br><br>

<strong>
Income alone doesn't tell me what you
should spend on a home.
</strong>

<br><br>

I need to understand your debts and
monthly obligations too.

</div>

<h2>About how much do you pay toward debt each month?</h2>

<input
id="debt"
type="number"
placeholder="Example: 1250"
style="
width:100%;
padding:15px;
font-size:16px;
border:1px solid #d9e2ec;
border-radius:12px;
box-sizing:border-box;
">

<button onclick="finishDemo()">
Continue →
</button>

`;

}

function finishDemo() {

screen.innerHTML = `

<div class="ai">

🏠 <strong>HomeBuy AI</strong>

<br><br>

Alright. We're getting somewhere.

<br><br>

This is just the beginning of your
HomeBuy AI profile.

<br><br>

In the next version, I'll take your
income, debts, savings, down payment,
military status, location, taxes,
insurance, and other information and
help you determine:

<br><br>

<strong>
🟢 Comfortable
</strong>

<br>

<strong>
🟡 Stretch
</strong>

<br>

<strong>
🔴 Not Recommended
</strong>

<br><br>

And then you'll be able to ask me
questions about your situation.

<br><br>

<strong>
AI can help. You make the decision.
</strong>

</div>

<button onclick="welcome()">
Start Over
</button>

`;

}

welcome();

</script>

</body>
</html>
