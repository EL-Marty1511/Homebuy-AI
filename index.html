<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeBuy AI</title>

<style>

:root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-light: #eff6ff;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --orange: #f97316;
    --orange-light: #fff7ed;
    --yellow: #eab308;
    --yellow-light: #fefce8;
    --red: #dc2626;
    --red-light: #fef2f2;
    --dark: #172033;
    --text: #334155;
    --muted: #64748b;
    --border: #e2e8f0;
    --background: #f6f8fc;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #eaf2ff, transparent 35%),
        radial-gradient(circle at top right, #f4edff, transparent 30%),
        var(--background);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.header {
    background: rgba(255,255,255,.95);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: white;
}

.logo-text h1 {
    margin: 0;
    color: var(--dark);
    font-size: 19px;
}

.logo-text p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
}

.ai-badge {
    background: var(--purple-light);
    color: var(--purple);
    padding: 8px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
}

.main {
    max-width: 900px;
    margin: auto;
    padding: 28px 18px 70px;
}

.progress-area {
    margin-bottom: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: bold;
    color: var(--muted);
    margin-bottom: 8px;
}

.progress-bar {
    height: 8px;
    background: #e5eaf2;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    border-radius: 20px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(15,23,42,.07);
}

.welcome {
    text-align: center;
    padding: 45px 25px;
    position: relative;
    overflow: hidden;
}

.house {
    font-size: 70px;
    margin-bottom: 10px;
}

.welcome h2 {
    font-size: 42px;
    margin: 0;
    color: var(--dark);
}

.gradient {
    background: linear-gradient(90deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    color: transparent;
}

.welcome-description {
    max-width: 650px;
    margin: 15px auto;
    line-height: 1.7;
    color: var(--muted);
    font-size: 16px;
}

.trust-box {
    max-width: 700px;
    margin: 25px auto;
    padding: 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--blue-light), var(--purple-light));
    text-align: left;
    line-height: 1.6;
    font-size: 14px;
}

.features {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin: 25px 0;
}

.feature {
    padding: 18px 12px;
    border: 1px solid var(--border);
    border-radius: 18px;
}

.feature-icon {
    font-size: 28px;
}

.feature strong {
    display: block;
    margin-top: 7px;
    color: var(--dark);
}

.feature span {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: var(--muted);
}

.btn {
    border: none;
    border-radius: 14px;
    padding: 14px 22px;
    font-weight: bold;
    font-size: 15px;
}

.primary {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: white;
    box-shadow: 0 8px 20px rgba(37,99,235,.2);
}

.primary:hover {
    transform: translateY(-2px);
}

.secondary {
    background: white;
    color: var(--text);
    border: 2px solid var(--border);
}

.screen-title {
    margin-bottom: 22px;
}

.step {
    display: inline-block;
    background: var(--blue-light);
    color: var(--blue);
    border-radius: 30px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}

.screen-title h2 {
    margin: 0;
    color: var(--dark);
    font-size: 34px;
}

.screen-title p {
    color: var(--muted);
    line-height: 1.6;
    margin-top: 8px;
}

.section {
    margin-bottom: 25px;
}

.section-title {
    color: var(--dark);
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.options {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.option {
    border: 2px solid var(--border);
    background: white;
    border-radius: 18px;
    padding: 18px;
    text-align: left;
    min-height: 95px;
    transition: .2s;
}

.option:hover {
    border-color: #93c5fd;
    box-shadow: 0 8px 20px rgba(15,23,42,.07);
}

.option.selected {
    border-color: var(--blue);
    background: var(--blue-light);
}

.option-icon {
    font-size: 28px;
    margin-bottom: 7px;
}

.option-title {
    display: block;
    font-weight: bold;
    color: var(--dark);
}

.option-description {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.4;
}

.form-card {
    padding: 24px;
}

label {
    display: block;
    color: var(--dark);
    font-weight: bold;
    margin-bottom: 9px;
}

input,
select {
    width: 100%;
    padding: 15px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: white;
    color: var(--dark);
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--blue);
}

.help {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
}

.input-group {
    margin-bottom: 22px;
}

.info {
    background: var(--orange-light);
    border: 1px solid #fed7aa;
    padding: 17px;
    border-radius: 17px;
    font-size: 13px;
    line-height: 1.6;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 25px;
}

.review {
    margin-bottom: 14px;
    overflow: hidden;
}

.review-header {
    padding: 15px 18px;
    background: #f8fafc;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.review-header strong {
    color: var(--dark);
}

.edit {
    border: none;
    background: var(--blue-light);
    color: var(--blue);
    padding: 7px 10px;
    border-radius: 8px;
    font-weight: bold;
}

.review-body {
    padding: 17px 18px;
}

.review-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 6px 0;
}

.review-row span {
    color: var(--muted);
}

.review-row strong {
    color: var(--dark);
    text-align: right;
}

.dashboard-header {
    background: linear-gradient(135deg, #172033, #334c7a);
    color: white;
    padding: 30px;
    border-radius: 25px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
}

.dashboard-header h2 {
    margin: 0;
    font-size: 31px;
}

.dashboard-header p {
    color: #dbe5f4;
    line-height: 1.6;
    max-width: 650px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 14px;
}

.dashboard-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    transition: .2s;
    position: relative;
}

.dashboard-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(15,23,42,.1);
}

.dashboard-icon {
    width: 55px;
    height: 55px;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    margin-bottom: 14px;
}

.blue-bg {
    background: var(--blue-light);
}

.green-bg {
    background: var(--green-light);
}

.purple-bg {
    background: var(--purple-light);
}

.orange-bg {
    background: var(--orange-light);
}

.yellow-bg {
    background: var(--yellow-light);
}

.dashboard-card h3 {
    margin: 0;
    color: var(--dark);
}

.dashboard-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.card-link {
    color: var(--blue);
    font-weight: bold;
    font-size: 13px;
}

.coming {
    opacity: .75;
}

.badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #f1f5f9;
    color: var(--muted);
    padding: 6px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: bold;
}

.affordability {
    padding: 28px;
}

.big-number {
    font-size: 55px;
    font-weight: 900;
    color: var(--dark);
    text-align: center;
}

.center {
    text-align: center;
}

.muted {
    color: var(--muted);
    font-size: 13px;
}

.metrics {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin-top: 25px;
}

.metric {
    background: #f8fafc;
    border-radius: 16px;
    padding: 15px;
}

.metric small {
    display: block;
    color: var(--muted);
}

.metric strong {
    display: block;
    margin-top: 6px;
    color: var(--dark);
}

.ai-box {
    background: linear-gradient(135deg, var(--purple-light), var(--blue-light));
    border: 1px solid #ddd6fe;
    border-radius: 18px;
    padding: 20px;
    margin-top: 20px;
    line-height: 1.6;
}

.ai-title {
    color: var(--purple);
    font-weight: bold;
}

.risk {
    text-align: center;
    padding: 18px;
    border-radius: 17px;
    margin-top: 20px;
    font-weight: bold;
}

.green-risk {
    background: var(--green-light);
    color: var(--green);
}

.yellow-risk {
    background: var(--yellow-light);
    color: #a16207;
}

.red-risk {
    background: var(--red-light);
    color: var(--red);
}

@media(max-width:700px) {

    .main {
        padding: 18px 12px 50px;
    }

    .ai-badge {
        display: none;
    }

    .welcome {
        padding: 35px 18px;
    }

    .welcome h2 {
        font-size: 34px;
    }

    .features {
        grid-template-columns: 1fr;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .metrics {
        grid-template-columns: 1fr;
    }

    .navigation {
        flex-direction: column-reverse;
    }

    .navigation .btn {
        width: 100%;
    }

    .review-row {
        flex-direction: column;
        gap: 3px;
    }

    .review-row strong {
        text-align: left;
    }

    .big-number {
        font-size: 42px;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo-area">

            <div class="logo">
                🏠
            </div>

            <div class="logo-text">
                <h1>HomeBuy AI</h1>
                <p>Your Homebuying Advisor</p>
            </div>

        </div>

        <div class="ai-badge">
            🤖 AI Powered
        </div>

    </div>

</header>


<main class="main">

    <div id="app"></div>

</main>


<script>

/* =========================================
   HOME BUY AI
========================================= */

var answers = {
    homeStatus: "",
    military: "",
    militaryStatus: "",
    state: "",
    location: "",
    loanType: "",
    income: "",
    debt: "",
    savings: "",
    downPayment: "",
    creditScore: "",
    comfortablePayment: "",
    emergencySavings: "",
    propertyType: "",
    purchasePurpose: "",
    timeline: "",
    targetPrice: "",
    priorities: []
};

var step = 0;

var states = [
    "Alabama","Alaska","Arizona","Arkansas","California",
    "Colorado","Connecticut","Delaware","Florida","Georgia",
    "Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas",
    "Kentucky","Louisiana","Maine","Maryland","Massachusetts",
    "Michigan","Minnesota","Mississippi","Missouri","Montana",
    "Nebraska","Nevada","New Hampshire","New Jersey",
    "New Mexico","New York","North Carolina","North Dakota",
    "Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island",
    "South Carolina","South Dakota","Tennessee","Texas","Utah",
    "Vermont","Virginia","Washington","West Virginia",
    "Wisconsin","Wyoming"
];

var app = document.getElementById("app");


/* =========================================
   STORAGE
========================================= */

function save() {

    try {
        localStorage.setItem(
            "homebuyAIAnswers",
            JSON.stringify(answers)
        );
    } catch(e) {}

}


function load() {

    try {

        var saved =
            localStorage.getItem("homebuyAIAnswers");

        if (saved) {

            var parsed =
                JSON.parse(saved);

            for (var key in parsed) {

                if (
                    Object.prototype.hasOwnProperty.call(
                        answers,
                        key
                    )
                ) {

                    answers[key] = parsed[key];

                }

            }

        }

    } catch(e) {}

}


load();


/* =========================================
   ESCAPE
========================================= */

function safe(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   PROGRESS
========================================= */

function progress(number) {

    if (number === 0) {
        return "";
    }

    var percent =
        Math.round((number / 8) * 100);

    return `
        <div class="progress-area">

            <div class="progress-info">
                <span>Your Homebuying Journey</span>
                <span>${number} of 8</span>
            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percent}%"
                ></div>

            </div>

        </div>
    `;
}


/* =========================================
   OPTION
========================================= */

function option(
    emoji,
    title,
    value,
    selected,
    action,
    description
) {

    return `
        <button
            type="button"
            class="option ${selected ? "selected" : ""}"
            onclick="${action}"
        >

            <div class="option-icon">
                ${emoji}
            </div>

            <span class="option-title">
                ${safe(title)}
            </span>

            ${
                description
                ?
                `<span class="option-description">
                    ${safe(description)}
                </span>`
                :
                ""
            }

        </button>
    `;
}


/* =========================================
   WELCOME
========================================= */

function welcome() {

    step = 0;

    app.innerHTML = `

        <div class="card welcome">

            <div class="house">
                🏡
            </div>

            <h2>
                Welcome to
                <span class="gradient">
                    HomeBuy AI
                </span>
            </h2>

            <p class="welcome-description">
                Buying a home is one of the biggest financial
                decisions you'll ever make. HomeBuy AI helps
                you understand the numbers before you make it.
            </p>

            <div class="trust-box">

                <strong>
                    🤝 HomeBuy AI is here to help you get to the right professionals.
                </strong>

                <br><br>

                HomeBuy AI does not replace your lender,
                real estate agent, inspector, insurance agent,
                title company, property manager, or other
                professionals involved in the homebuying process.

                <br><br>

                Instead, we'll help you understand when you
                may need them, what questions to ask, and
                eventually help you find professionals who
                can assist you.

                <br><br>

                <strong>
                    AI helps you prepare. Professionals help you complete the process. You make the decision.
                </strong>

            </div>

            <div class="features">

                <div class="feature">
                    <div class="feature-icon">💰</div>
                    <strong>Know Your Numbers</strong>
                    <span>Understand what your home could really cost.</span>
                </div>

                <div class="feature">
                    <div class="feature-icon">🧠</div>
                    <strong>Make Better Decisions</strong>
                    <span>See the financial tradeoffs before buying.</span>
                </div>

                <div class="feature">
                    <div class="feature-icon">🤝</div>
                    <strong>Find The Right Help</strong>
                    <span>Connect with professionals when you need them.</span>
                </div>

            </div>

            <button
                class="btn primary"
                onclick="start()"
            >
                🚀 Let's Get Started
            </button>

        </div>
    `;
}


function start() {

    step = 1;

    aboutYou();
}


/* =========================================
   ABOUT YOU
========================================= */

function aboutYou() {

    step = 1;

    app.innerHTML = `

        ${progress(step)}

        <div class="screen-title">

            <div class="step">
                👋 STEP 1
            </div>

            <h2>
                Tell us a little about you
            </h2>

            <p>
                This helps us understand what type of
                homebuying journey you're on.
            </p>

        </div>

        <div class="card form-card">

            <div class="section">

                <div class="section-title">
                    🏠 Have you owned a home before?
                </div>

                <div class="options">

                    ${option(
                        "🌱",
                        "I'm a first-time buyer",
                        "first",
                        answers.homeStatus === "first",
                        "homeStatus('first')",
                        "I'm purchasing my first home."
                    )}

                    ${option(
                        "🏡",
                        "Yes, I've owned a home",
                        "previous",
                        answers.homeStatus === "previous",
                        "homeStatus('previous')",
                        "I've owned a home before."
                    )}

                    ${option(
                        "🏘️",
                        "I own multiple properties",
                        "multiple",
                        answers.homeStatus === "multiple",
                        "homeStatus('multiple')",
                        "I'm looking at another property."
                    )}

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    🪖 Have you served in the military?
                </div>

                <div class="options">

                    ${option(
                        "🇺🇸",
                        "Yes",
                        "yes",
                        answers.military === "yes",
                        "military('yes')",
                        "We'll show military related pathways."
                    )}

                    ${option(
                        "🙂",
                        "No",
                        "no",
                        answers.military === "no",
                        "military('no')",
                        "We'll show other pathways."
                    )}

                </div>

            </div>

            ${
                answers.military === "yes"
                ?
                `
                <div class="section">

                    <div class="section-title">
                        🎖️ What is your military status?
                    </div>

                    <div class="options">

                        ${option("🪖","Active Duty","active",answers.militaryStatus==="active","militaryStatus('active')")}

                        ${option("🇺🇸","Reserve","reserve",answers.militaryStatus==="reserve","militaryStatus('reserve')")}

                        ${option("⭐","National Guard","guard",answers.militaryStatus==="guard","militaryStatus('guard')")}

                        ${option("🎖️","Veteran","veteran",answers.militaryStatus==="veteran","militaryStatus('veteran')")}

                        ${option("🏅","Retired Military","retired",answers.militaryStatus==="retired","militaryStatus('retired')")}

                    </div>

                </div>
                `
                :
                ""
            }

        </div>

        <div class="navigation">

            <button
                class="btn secondary"
                onclick="welcome()"
            >
                ← Back
            </button>

            <button
                class="btn primary"
                onclick="continueAbout()"
            >
                Continue →
            </button>

        </div>
    `;
}


function homeStatus(value) {

    answers.homeStatus = value;

    save();

    aboutYou();
}


function military(value) {

    answers.military = value;

    if (value === "no") {

        answers.militaryStatus = "";

        if (answers.loanType === "VA") {
            answers.loanType = "";
        }

    }

    save();

    aboutYou();
}


function militaryStatus(value) {

    answers.militaryStatus = value;

    save();

    aboutYou();
}


function continueAbout() {

    if (!answers.homeStatus) {
        alert("Please select your homeownership status.");
        return;
    }

    if (!answers.military) {
        alert("Please select whether you have served in the military.");
        return;
    }

    if (
        answers.military === "yes" &&
        !answers.militaryStatus
    ) {
        alert("Please select your military status.");
        return;
    }

    locationScreen();
}


/* =========================================
   LOCATION
========================================= */

function locationScreen() {

    step = 2;

    var stateOptions =
        `<option value="">Select your state</option>`;

    for (var i = 0; i < states.length; i++) {

        stateOptions += `
            <option
                value="${safe(states[i])}"
                ${answers.state === states[i] ? "selected" : ""}
            >
                ${safe(states[i])}
            </option>
        `;

    }

    app.innerHTML = `

        ${progress(step)}

        <div class="screen-title">

            <div class="step">
                📍 STEP 2
            </div>

            <h2>
                Where are you buying?
            </h2>

            <p>
                Location can affect taxes, insurance,
                programs, and the true cost of owning a home.
            </p>

        </div>

        <div class="card form-card">

            <div class="input-group">

                <label>
                    🇺🇸 What state are you looking in?
                </label>

                <select
                    onchange="setState(this.value)"
                >

    answers.propertyType = value;

    answers.purchasePurpose = value;

    save();

    homeScreen();

    answers.timeline = value;

    save();

    homeScreen();
}


function targetPrice(value) {

    answers.targetPrice = value;

    save();
}


function preservePrice() {

    var input =
        document.getElementById("targetPrice");

    if (input) {
        answers.targetPrice = input.value;
    }
}


function priority(emoji,title,value) {

    var selected =
        answers.priorities.indexOf(value) !== -1;

    return `
        <button
            type="button"
            class="option ${selected ? "selected" : ""}"
            onclick="togglePriority('${value}')"
        >

            <div class="option-icon">
                ${emoji}
            </div>

            <span class="option-title">
                ${title}
            </span>

        </button>
    `;
}


function togglePriority(value) {

    preservePrice();

    var index =
        answers.priorities.indexOf(value);

    if (index === -1) {

        answers.priorities.push(value);

    } else {

        answers.priorities.splice(index,1);

    }

    save();

    homeScreen();
}


function continueHome() {

    preservePrice();

    save();

    if (!answers.propertyType) {
        alert("Please select a property type.");
        return;
    }

    if (!answers.purchasePurpose) {
        alert("Please select what you plan to use the property for.");
        return;
    }

    if (!answers.timeline) {
        alert("Please select your purchase timeline.");
        return;
    }

    if (answers.priorities.length === 0) {
        alert("Please select at least one priority.");
        return;
    }

    reviewScreen();
}

    return `

/* =========================================

========================================= */

function affordability() {

    var income =
        Number(answers.income || 0);

    var debt =
        Number(answers.debt || 0);

    var monthlyIncome =
        income / 12;

    var housingEstimate =
        monthlyIncome * .28;

    var priceEstimate =
        housingEstimate * 12 * 4.5;

    if (answers.targetPrice) {
        priceEstimate =
            Number(answers.targetPrice);
    }

    var risk = "🟢 Comfortable";
    var riskClass = "green-risk";

    if (
        answers.emergencySavings === "under5"
    ) {

        risk = "🟡 Needs Attention";
        riskClass = "yellow-risk";

    }

    app.innerHTML = `

        <div class="screen-title">

                        $${debt.toLocaleString()}

                        $${Math.round(housingEstimate).toLocaleString()}

function analyze() {

    var input =
        document.getElementById("challengePrice");

    var price =
        Number(input.value);

    if (!price || price <= 0) {

        alert("Please enter a valid home price.");

        return;
    }

    var mortgage =
        price * .005;

    var taxes =
        price * .0012;

    var insurance =
        price * .00035;

    var maintenance =
        price * .00083;

    var utilities = 250;

    var total =
        mortgage +
        taxes +
        insurance +
        maintenance +
        utilities;

    var risk = "🟢 Looks Reasonable";
    var riskClass = "green-risk";

    if (
        answers.emergencySavings === "under5"
    ) {

        risk = "🟡 This May Be a Stretch";
        riskClass = "yellow-risk";

    }

    app.innerHTML = `

        <div class="screen-title">

                🤖 HOME ANALYSIS
            </div>

                    </strong>
                </div>

                <div class="metric">
