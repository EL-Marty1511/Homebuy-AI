<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeBuy AI | Your Homebuying Advisor</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--purple:#7c3aed;--green:#16a34a;
  --orange:#f97316;--yellow:#eab308;--red:#dc2626;--dark:#172033;
  --text:#334155;--muted:#64748b;--border:#e2e8f0;--bg:#f6f8fc;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);
background:radial-gradient(circle at 0 0,#eaf2ff,transparent 34%),radial-gradient(circle at 100% 0,#f4edff,transparent 30%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border)}
.header-inner{max-width:980px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo-area{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:25px;color:white}
.logo-text h1{margin:0;color:var(--dark);font-size:19px}.logo-text p{margin:3px 0 0;color:var(--muted);font-size:12px}
.ai-badge{background:#f5f3ff;color:var(--purple);padding:8px 13px;border-radius:30px;font-size:12px;font-weight:bold}
.main{max-width:900px;margin:auto;padding:28px 18px 70px}
.progress{margin-bottom:25px}.progress-info{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:bold;margin-bottom:8px}
.progress-bar{height:8px;background:#e5eaf2;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}
.card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
.welcome{text-align:center;padding:44px 24px}.house{font-size:68px}.welcome h2{font-size:42px;margin:5px 0;color:var(--dark)}.gradient{background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-description{max-width:650px;margin:15px auto;line-height:1.7;color:var(--muted)}
.trust{max-width:700px;margin:25px auto;padding:20px;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);text-align:left;line-height:1.6;font-size:14px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.feature{padding:18px 12px;border:1px solid var(--border);border-radius:18px}.feature-icon{font-size:28px}.feature strong{display:block;margin-top:7px;color:var(--dark)}.feature span{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:bold;font-size:15px}.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;box-shadow:0 8px 20px rgba(37,99,235,.2)}.secondary{background:#fff;color:var(--text);border:2px solid var(--border)}
.title{margin-bottom:22px}.step{display:inline-block;background:#eff6ff;color:var(--blue);border-radius:30px;padding:7px 12px;font-size:12px;font-weight:bold;margin-bottom:10px}.title h2{margin:0;color:var(--dark);font-size:34px}.title p{color:var(--muted);line-height:1.6;margin-top:8px}
.form{padding:24px}.section{margin-bottom:24px}.section:last-child{margin-bottom:0}.section-title{font-weight:bold;color:var(--dark);margin-bottom:12px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{border:2px solid var(--border);background:#fff;border-radius:18px;padding:18px;text-align:left;min-height:92px;transition:.18s}.option:hover{border-color:#93c5fd;transform:translateY(-2px)}.option.selected{border-color:var(--blue);background:#eff6ff}.icon{font-size:28px;margin-bottom:7px}.option strong{display:block;color:var(--dark)}.desc{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:5px}
label{display:block;font-weight:bold;color:var(--dark);margin-bottom:9px}input,select{width:100%;padding:15px;border:2px solid var(--border);border-radius:14px;background:white;color:var(--dark);outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.07)}.help{font-size:12px;color:var(--muted);margin-top:6px}.input-group{margin-bottom:22px}
.info{background:#fff7ed;border:1px solid #fed7aa;padding:17px;border-radius:17px;font-size:13px;line-height:1.6}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
.review{margin-bottom:14px;overflow:hidden}.review-head{padding:15px 18px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center}.review-head strong{color:var(--dark)}.edit{border:0;background:#eff6ff;color:var(--blue);padding:7px 10px;border-radius:8px;font-weight:bold}.review-body{padding:17px 18px}.row{display:flex;justify-content:space-between;gap:20px;padding:6px 0}.row span{color:var(--muted)}.row strong{color:var(--dark);text-align:right}
.dash-head{background:linear-gradient(135deg,#172033,#334c7a);color:#fff;padding:30px;border-radius:25px;margin-bottom:18px}.dash-head h2{margin:0;font-size:31px}.dash-head p{color:#dbe5f4;line-height:1.6;max-width:650px}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.dash-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;transition:.18s;position:relative}.dash-card:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(15,23,42,.1)}.dash-icon{width:55px;height:55px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px}.b{background:#eff6ff}.g{background:#f0fdf4}.p{background:#f5f3ff}.o{background:#fff7ed}.y{background:#fefce8}.dash-card h3{margin:0;color:var(--dark)}.dash-card p{color:var(--muted);font-size:13px;line-height:1.6}.link{color:var(--blue);font-weight:bold;font-size:13px}.coming{opacity:.72}.badge{position:absolute;right:15px;top:15px;background:#f1f5f9;color:var(--muted);padding:6px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.afford{padding:28px}.center{text-align:center}.big{font-size:54px;font-weight:900;color:var(--dark);margin:8px 0}.muted{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.metric{background:#f8fafc;border-radius:16px;padding:15px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;margin-top:6px;color:var(--dark)}.ai{background:linear-gradient(135deg,#f5f3ff,#eff6ff);border:1px solid #ddd6fe;border-radius:18px;padding:20px;margin-top:20px;line-height:1.6}.ai strong{color:var(--purple)}.risk{text-align:center;padding:17px;border-radius:17px;margin-top:20px;font-weight:bold}.green{background:#f0fdf4;color:var(--green)}.yellow{background:#fefce8;color:#a16207}.red{background:#fef2f2;color:var(--red)}
@media(max-width:700px){.main{padding:18px 12px 50px}.ai-badge{display:none}.welcome{padding:35px 18px}.welcome h2{font-size:34px}.features,.options,.dash-grid,.metrics{grid-template-columns:1fr}.nav{flex-direction:column-reverse}.nav .btn{width:100%}.row{flex-direction:column;gap:3px}.row strong{text-align:left}.big{font-size:42px}}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div class="logo-area"><div class="logo">🏠</div><div class="logo-text"><h1>HomeBuy AI</h1><p>Your Homebuying Advisor</p></div></div>
<div class="ai-badge">🤖 AI Powered</div>
</div>
</header>
<main class="main"><div id="app"></div></main>

<script>
var A={
homeStatus:"",military:"",militaryStatus:"",state:"",location:"",loanType:"",
income:"",debt:"",savings:"",downPayment:"",creditScore:"",comfortablePayment:"",
emergencySavings:"",propertyType:"",purchasePurpose:"",timeline:"",targetPrice:"",
priorities:[]
};

var states=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];

function save(){try{localStorage.setItem("homebuyAIAnswers",JSON.stringify(A))}catch(e){}}
function load(){try{var x=localStorage.getItem("homebuyAIAnswers");if(x){var y=JSON.parse(x);Object.keys(A).forEach(function(k){if(y[k]!==undefined)A[k]=y[k]})}}catch(e){}}
load();

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function progress(n){if(!n)return"";return '<div class="progress"><div class="progress-info"><span>Your Homebuying Journey</span><span>'+n+' of 8</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(n/8*100)+'%"></div></div></div>'}
function opt(icon,title,value,selected,fn,desc){return '<button type="button" class="option '+(selected?"selected":"")+'" onclick="'+fn+'"><div class="icon">'+icon+'</div><strong>'+title+'</strong>'+(desc?'<span class="desc">'+desc+'</span>':"")+'</button>'}

function welcome(){
document.getElementById("app").innerHTML=
'<div class="card welcome"><div class="house">🏡</div><h2>Welcome to <span class="gradient">HomeBuy AI</span></h2>'+
'<p class="welcome-description">Buying a home is one of the biggest financial decisions you will ever make. HomeBuy AI helps you understand the numbers before you make it.</p>'+
'<div class="trust"><strong>🤝 HomeBuy AI is here to help you get to the right professionals.</strong><br><br>'+
'HomeBuy AI does not replace your lender, real estate agent, inspector, insurance agent, title company, property manager, or other professionals involved in the homebuying process.<br><br>'+
'Instead, we help you understand when you may need them, what questions to ask, and eventually help you find professionals who can assist you.<br><br>'+
'<strong>AI helps you prepare. Professionals help you complete the process. You make the decision.</strong></div>'+
'<div class="features"><div class="feature"><div class="feature-icon">💰</div><strong>Know Your Numbers</strong><span>Understand what your home could really cost.</span></div>'+
'<div class="feature"><div class="feature-icon">🧠</div><strong>Make Better Decisions</strong><span>See financial tradeoffs before buying.</span></div>'+
'<div class="feature"><div class="feature-icon">🤝</div><strong>Find The Right Help</strong><span>Connect with professionals when you need them.</span></div></div>'+
'<button class="btn primary" onclick="about()">🚀 Let’s Get Started</button></div>';
}

function about(){
document.getElementById("app").innerHTML=progress(1)+
'<div class="title"><div class="step">👋 STEP 1</div><h2>Tell us a little about you</h2><p>This helps us understand what type of homebuying journey you are on.</p></div>'+
'<div class="card form"><div class="section"><div class="section-title">🏠 Have you owned a home before?</div><div class="options">'+
opt("🌱","I’m a first-time buyer","first",A.homeStatus==="first","setHome('first')","I’m purchasing my first home.")+
opt("🏡","Yes, I’ve owned a home","previous",A.homeStatus==="previous","setHome('previous')","I’ve owned a home before.")+
opt("🏘️","I own multiple properties","multiple",A.homeStatus==="multiple","setHome('multiple')","I’m looking at another property.")+
'</div></div><div class="section"><div class="section-title">🪖 Have you served in the military?</div><div class="options">'+
opt("🇺🇸","Yes","yes",A.military==="yes","setMilitary('yes')","We’ll show military related pathways.")+
opt("🙂","No","no",A.military==="no","setMilitary('no')","We’ll show other pathways.")+
'</div></div>'+
(A.military==="yes"?'<div class="section"><div class="section-title">🎖️ What is your military status?</div><div class="options">'+
opt("🪖","Active Duty","active",A.militaryStatus==="active","setMilStatus('active')")+
opt("🇺🇸","Reserve","reserve",A.militaryStatus==="reserve","setMilStatus('reserve')")+
opt("⭐","National Guard","guard",A.militaryStatus==="guard","setMilStatus('guard')")+
opt("🎖️","Veteran","veteran",A.militaryStatus==="veteran","setMilStatus('veteran')")+
opt("🏅","Retired Military","retired",A.militaryStatus==="retired","setMilStatus('retired')")+
'</div></div>':"")+
'</div><div class="nav"><button class="btn secondary" onclick="welcome()">← Back</button><button class="btn primary" onclick="continueAbout()">Continue →</button></div>';
}
function setHome(v){A.homeStatus=v;save();about()}
function setMilitary(v){A.military=v;if(v==="no"){A.militaryStatus="";if(A.loanType==="VA")A.loanType=""}save();about()}
function setMilStatus(v){A.militaryStatus=v;save();about()}
function continueAbout(){if(!A.homeStatus)return alert("Please select your homeownership status.");if(!A.military)return alert("Please select whether you have served in the military.");if(A.military==="yes"&&!A.militaryStatus)return alert("Please select your military status.");locationScreen()}

function locationScreen(){
var o='<option value="">Select your state</option>';states.forEach(function(s){o+='<option value="'+esc(s)+'" '+(A.state===s?"selected":"")+'>'+esc(s)+'</option>'});
document.getElementById("app").innerHTML=progress(2)+'<div class="title"><div class="step">📍 STEP 2</div><h2>Where are you buying?</h2><p>Location can affect taxes, insurance, programs, and the true cost of owning a home.</p></div>'+
'<div class="card form"><div class="input-group"><label>🇺🇸 What state are you looking in?</label><select onchange="setState(this.value)">'+o+'</select></div>'+
'<div class="input-group"><label>📍 City, County, or ZIP</label><input type="text" value="'+esc(A.location)+'" placeholder="Example: Waukegan or 60085" oninput="setLocation(this.value)"></div>'+
(A.state?'<div class="info"><strong>💡 Why do we ask for your state?</strong><br>Your state may offer benefits, grants, tax programs, down payment assistance, or other resources that could help during the homebuying process.</div>':"")+
'</div><div class="nav"><button class="btn secondary" onclick="about()">← Back</button><button class="btn primary" onclick="continueLocation()">Continue →</button></div>';
}
function setState(v){A.state=v;save();locationScreen()}function setLocation(v){A.location=v;save()}
function continueLocation(){if(!A.state)return alert("Please select your state.");if(!A.location.trim())return alert("Please enter a city, county, or ZIP.");loanScreen()}

function loanScreen(){
var h="";
if(A.military==="yes")h+=opt("🪖","VA Loan","VA",A.loanType==="VA","setLoan('VA')","For eligible veterans and service members.");
h+=opt("🏦","FHA Loan","FHA",A.loanType==="FHA","setLoan('FHA')","A common option with lower down payment requirements.");
h+=opt("🏠","Conventional Loan","Conventional",A.loanType==="Conventional","setLoan('Conventional')","A common home loan offered by private lenders.");
h+=opt("🌾","USDA Loan","USDA",A.loanType==="USDA","setLoan('USDA')","May be available for eligible properties.");
h+=opt("💵","Cash","Cash",A.loanType==="Cash","setLoan('Cash')","Purchasing without a mortgage.");
h+=opt("🤔","I’m Not Sure","Not Sure",A.loanType==="Not Sure","setLoan('Not Sure')","That’s okay. We’ll help you understand your options.");
document.getElementById("app").innerHTML=progress(3)+'<div class="title"><div class="step">💳 STEP 3</div><h2>How are you buying?</h2><p>Don’t worry if you don’t know yet. Choosing “I’m Not Sure” is completely okay.</p></div><div class="options">'+h+'</div><div class="nav"><button class="btn secondary" onclick="locationScreen()">← Back</button><button class="btn primary" onclick="continueLoan()">Continue →</button></div>';
}
function setLoan(v){A.loanType=v;save();loanScreen()}function continueLoan(){if(!A.loanType)return alert("Please select a loan option.");incomeScreen()}

function incomeScreen(){
document.getElementById("app").innerHTML=progress(4)+'<div class="title"><div class="step">💼 STEP 4</div><h2>Let’s talk about income</h2><p>This helps HomeBuy AI understand what monthly payment may fit your lifestyle.</p></div>'+
'<div class="card form"><div class="input-group"><label>💰 Annual household income</label><input type="number" min="0" value="'+esc(A.income)+'" placeholder="Example: 85000" oninput="A.income=this.value;save()"><div class="help">Include the household income you expect to use when buying.</div></div>'+
'<div class="input-group"><label>💳 Monthly debt payments</label><input type="number" min="0" value="'+esc(A.debt)+'" placeholder="Example: 800" oninput="A.debt=this.value;save()"><div class="help">Include car payments, student loans, credit cards, and other recurring debt.</div></div></div>'+
'<div class="nav"><button class="btn secondary" onclick="loanScreen()">← Back</button><button class="btn primary" onclick="continueIncome()">Continue →</button></div>';
}
function continueIncome(){if(!A.income)return alert("Please enter your annual household income.");if(A.debt==="")return alert("Please enter your monthly debt payments. Enter 0 if you have none.");moneyScreen()}

function moneyScreen(){
document.getElementById("app").innerHTML=progress(5)+'<div class="title"><div class="step">💵 STEP 5</div><h2>What does your buying power look like?</h2><p>We’re looking at more than just your down payment. Cash reserves matter too.</p></div>'+
'<div class="card form"><div class="section"><div class="section-title">💰 How much do you have saved?</div><div class="options">'+
opt("💵","Under $5,000","under5",A.savings==="under5","setSavings('under5')")+opt("💵","$5,000 to $9,999","5to10",A.savings==="5to10","setSavings('5to10')")+opt("💰","$10,000 to $19,999","10to20",A.savings==="10to20","setSavings('10to20')")+opt("💰","$20,000 to $39,999","20to40",A.savings==="20to40","setSavings('20to40')")+opt("💎","$40,000 to $74,999","40to75",A.savings==="40to75","setSavings('40to75')")+opt("💎","$75,000+","75plus",A.savings==="75plus","setSavings('75plus')")+opt("🤔","I’m not sure","unknown",A.savings==="unknown","setSavings('unknown')")+
'</div></div><div class="section"><div class="section-title">🏦 How much are you planning to put toward the purchase?</div><div class="options">'+
opt("💵","Under $10,000","under10",A.downPayment==="under10","setDown('under10')")+opt("💰","$10,000 to $24,999","10to25",A.downPayment==="10to25","setDown('10to25')")+opt("💰","$25,000 to $49,999","25to50",A.downPayment==="25to50","setDown('25to50')")+opt("💎","$50,000+","50plus",A.downPayment==="50plus","setDown('50plus')")+opt("🤔","I’m not sure","unknown",A.downPayment==="unknown","setDown('unknown')")+
'</div></div></div><div class="nav"><button class="btn secondary" onclick="incomeScreen()">← Back</button><button class="btn primary" onclick="continueMoney()">Continue →</button></div>';
}
function setSavings(v){A.savings=v;save();moneyScreen()}function setDown(v){A.downPayment=v;save();moneyScreen()}
function continueMoney(){if(!A.savings)return alert("Please select your savings range.");if(!A.downPayment)return alert("Please select your down payment range.");comfortScreen()}

function comfortScreen(){
document.getElementById("app").innerHTML=progress(6)+'<div class="title"><div class="step">❤️ STEP 6</div><h2>What feels comfortable to you?</h2><p>Qualification and comfort are not always the same thing. We want to understand yours.</p></div>'+
'<div class="card form"><div class="section"><div class="section-title">🏠 Comfortable monthly housing payment</div><div class="options">'+
opt("🏠","Under $1,500","under1500",A.comfortablePayment==="under1500","setComfort('under1500')")+opt("🏠","$1,500 to $1,999","1500to1999",A.comfortablePayment==="1500to1999","setComfort('1500to1999')")+opt("🏡","$2,000 to $2,499","2000to2499",A.comfortablePayment==="2000to2499","setComfort('2000to2499')")+opt("🏡","$2,500 to $2,999","2500to2999",A.comfortablePayment==="2500to2999","setComfort('2500to2999')")+opt("🏠","$3,000 to $3,499","3000to3499",A.comfortablePayment==="3000to3499","setComfort('3000to3499')")+opt("💎","$3,500+","3500plus",A.comfortablePayment==="3500plus","setComfort('3500plus')")+opt("🤔","I’m not sure","unknown",A.comfortablePayment==="unknown","setComfort('unknown')")+
'</div></div><div class="section"><div class="section-title">📊 Approximate credit score</div><div class="options">'+
opt("⭐","760+","760",A.creditScore==="760","setCredit('760')")+opt("⭐","740 to 759","740",A.creditScore==="740","setCredit('740')")+opt("👍","700 to 739","700",A.creditScore==="700","setCredit('700')")+opt("👍","660 to 699","660",A.creditScore==="660","setCredit('660')")+opt("📈","620 to 659","620",A.creditScore==="620","setCredit('620')")+opt("⚠️","Below 620","below620",A.creditScore==="below620","setCredit('below620')")+opt("🤔","I don’t know","unknown",A.creditScore==="unknown","setCredit('unknown')")+
'</div></div><div class="section"><div class="section-title">🛟 Emergency savings after buying</div><div class="options">'+
opt("🪙","Less than $5,000","under5",A.emergencySavings==="under5","setEmergency('under5')")+opt("💵","$5,000 to $9,999","5to10",A.emergencySavings==="5to10","setEmergency('5to10')")+opt("💰","$10,000 to $19,999","10to20",A.emergencySavings==="10to20","setEmergency('10to20')")+opt("💎","$20,000+","20plus",A.emergencySavings==="20plus","setEmergency('20plus')")+opt("🤔","I’m not sure","unknown",A.emergencySavings==="unknown","setEmergency('unknown')")+
'</div></div></div><div class="nav"><button class="btn secondary" onclick="moneyScreen()">← Back</button><button class="btn primary" onclick="continueComfort()">Continue →</button></div>';
}
function setComfort(v){A.comfortablePayment=v;save();comfortScreen()}function setCredit(v){A.creditScore=v;save();comfortScreen()}function setEmergency(v){A.emergencySavings=v;save();comfortScreen()}
function continueComfort(){if(!A.comfortablePayment)return alert("Please select your comfortable monthly payment.");if(!A.creditScore)return alert("Please select your approximate credit score.");if(!A.emergencySavings)return alert("Please select your emergency savings.");homeScreen()}

function homeScreen(){
document.getElementById("app").innerHTML=progress(7)+'<div class="title"><div class="step">🏡 STEP 7</div><h2>Tell us about the home</h2><p>Help us understand what you’re trying to accomplish with the purchase.</p></div>'+
'<div class="card form"><div class="section"><div class="section-title">🏠 What type of property are you looking for?</div><div class="options">'+
opt("🏡","Single Family Home","single",A.propertyType==="single","setProperty('single')")+opt("🏘️","Multi Family Home","multi",A.propertyType==="multi","setProperty('multi')")+opt("🏢","Condo","condo",A.propertyType==="condo","setProperty('condo')")+opt("🌳","Land","land",A.propertyType==="land","setProperty('land')")+
'</div></div><div class="section"><div class="section-title">🎯 What are you planning to use the property for?</div><div class="options">'+
opt("🏠","My primary home","primary",A.purchasePurpose==="primary","setPurpose('primary')")+opt("💰","Investment property","investment",A.purchasePurpose==="investment","setPurpose('investment')")+opt("🌴","Second or vacation home","vacation",A.purchasePurpose==="vacation","setPurpose('vacation')")+opt("🏗️","Land to build on","build",A.purchasePurpose==="build","setPurpose('build')")+
'</div></div><div class="section"><div class="section-title">⏰ When are you planning to buy?</div><div class="options">'+
opt("🚀","Within 3 months","3months",A.timeline==="3months","setTimeline('3months')")+opt("📅","3 to 6 months","6months",A.timeline==="6months","setTimeline('6months')")+opt("🗓️","6 to 12 months","12months",A.timeline==="12months","setTimeline('12months')")+opt("🌱","1 to 2 years","2years",A.timeline==="2years","setTimeline('2years')")+opt("🔭","More than 2 years","more2",A.timeline==="more2","setTimeline('more2')")+opt("👀","I’m just exploring","exploring",A.timeline==="exploring","setTimeline('exploring')")+
'</div></div><div class="section"><div class="section-title">💵 Do you have a home price you’re currently targeting?</div><input id="target" type="number" min="0" value="'+esc(A.targetPrice)+'" placeholder="Example: 300000" oninput="A.targetPrice=this.value;save()"><div class="help">Optional. You can change this later.</div></div>'+
'<div class="section"><div class="section-title">❤️ What matters most to you?</div><div class="help" style="margin-bottom:12px">Choose as many as you want.</div><div class="options">'+
priority("💵","Lowest monthly payment","payment")+priority("💰","Lowest upfront cost","upfront")+priority("🏡","Larger home","larger")+priority("📍","Better neighborhood","neighborhood")+priority("🚗","Shorter commute","commute")+priority("📈","Building equity","equity")+priority("💎","Investment potential","investment")+priority("👨‍👩‍👧‍👦","More space for family","family")+priority("🎓","Schools","schools")+priority("🌳","Outdoor space","outdoor")+priority("❤️","Being close to family","familyclose")+
'</div></div></div><div class="nav"><button class="btn secondary" onclick="comfortScreen()">← Back</button><button class="btn primary" onclick="continueHome()">Review My Answers →</button></div>';
}
function preserve(){var x=document.getElementById("target");if(x)A.targetPrice=x.value}
function setProperty(v){preserve();A.propertyType=v;save();homeScreen()}function setPurpose(v){preserve();A.purchasePurpose=v;save();homeScreen()}function setTimeline(v){preserve();A.timeline=v;save();homeScreen()}
function priority(icon,title,value){return opt(icon,title,value,A.priorities.indexOf(value)>=0,"togglePriority('"+value+"')")}
function togglePriority(v){preserve();var i=A.priorities.indexOf(v);if(i<0)A.priorities.push(v);else A.priorities.splice(i,1);save();homeScreen()}
function continueHome(){preserve();save();if(!A.propertyType)return alert("Please select a property type.");if(!A.purchasePurpose)return alert("Please select what you plan to use the property for.");if(!A.timeline)return alert("Please select your purchase timeline.");if(!A.priorities.length)return alert("Please select at least one priority.");reviewScreen()}

function reviewCard(title,rows,where){
var body="";rows.forEach(function(r){if(r[1])body+='<div class="row"><span>'+r[0]+'</span><strong>'+esc(r[1])+'</strong></div>'});
return '<div class="card review"><div class="review-head"><strong>'+title+'</strong><button class="edit" onclick="'+where+'">✏️ Edit</button></div><div class="review-body">'+body+'</div></div>';
}
function reviewScreen(){
document.getElementById("app").innerHTML=progress(8)+'<div class="title"><div class="step">✅ STEP 8</div><h2>You’re almost ready</h2><p>Review your answers before entering HomeBuy AI.</p></div>'+
reviewCard("👋 About You",[["Homeownership",homeText()],["Military",A.military==="yes"?"Yes 🇺🇸":"No"],["Military Status",milText()]],"about()")+
reviewCard("📍 Location",[["State",A.state],["Location",A.location]],"locationScreen()")+
reviewCard("💳 Financing",[["Loan Type",loanText()]],"loanScreen()")+
reviewCard("💰 Finances",[["Annual Income","$"+Number(A.income||0).toLocaleString()],["Monthly Debt","$"+Number(A.debt||0).toLocaleString()],["Savings",savingsText()],["Down Payment",downText()]],"incomeScreen()")+
reviewCard("❤️ Comfort Zone",[["Comfortable Payment",comfortText()],["Credit Score",creditText()],["Emergency Savings",emergencyText()]],"comfortScreen()")+
reviewCard("🏡 Home Plan",[["Property",propertyText()],["Purpose",purposeText()],["Timeline",timelineText()],["Target Price",A.targetPrice?"$"+Number(A.targetPrice).toLocaleString():"Not provided"],["Priorities",A.priorities.join(", ")]],"homeScreen()")+
'<div class="nav"><button class="btn secondary" onclick="homeScreen()">← Back</button><button class="btn primary" onclick="dashboard()">🤖 Enter HomeBuy AI</button></div>';
}
function homeText(){return {first:"First time buyer",previous:"Previously owned a home",multiple:"Own multiple properties"}[A.homeStatus]||""}
function milText(){return {active:"Active Duty",reserve:"Reserve",guard:"National Guard",veteran:"Veteran",retired:"Retired Military"}[A.militaryStatus]||""}
function loanText(){return {VA:"VA Loan 🪖",FHA:"FHA Loan",Conventional:"Conventional Loan",USDA:"USDA Loan",Cash:"Cash","Not Sure":"I’m Not Sure"}[A.loanType]||""}
function savingsText(){return {under5:"Under $5,000","5to10":"$5,000 to $9,999","10to20":"$10,000 to $19,999","20to40":"$20,000 to $39,999","40to75":"$40,000 to $74,999","75plus":"$75,000+",unknown:"I’m not sure"}[A.savings]||""}
function downText(){return {under10:"Under $10,000","10to25":"$10,000 to $24,999","25to50":"$25,000 to $49,999","50plus":"$50,000+",unknown:"I’m not sure"}[A.downPayment]||""}
function comfortText(){return {under1500:"Under $1,500","1500to1999":"$1,500 to $1,999","2000to2499":"$2,000 to $2,499","2500to2999":"$2,500 to $2,999","3000to3499":"$3,000 to $3,499","3500plus":"$3,500+",unknown:"I’m not sure"}[A.comfortablePayment]||""}
function creditText(){return {760:"760+",740:"740 to 759",700:"700 to 739",660:"660 to 699",620:"620 to 659","below620":"Below 620",unknown:"I don’t know"}[A.creditScore]||""}
function emergencyText(){return {under5:"Less than $5,000","5to10":"$5,000 to $9,999","10to20":"$10,000 to $19,999","20plus":"$20,000+",unknown:"I’m not sure"}[A.emergencySavings]||""}
function propertyText(){return {single:"Single Family Home",multi:"Multi Family Home",condo:"Condo",land:"Land"}[A.propertyType]||""}
function purposeText(){return {primary:"Primary Home",investment:"Investment Property",vacation:"Second or Vacation Home",build:"Land to Build On"}[A.purchasePurpose]||""}
function timelineText(){return {"3months":"Within 3 months","6months":"3 to 6 months","12months":"6 to 12 months","2years":"1 to 2 years",more2:"More than 2 years",exploring:"Just exploring"}[A.timeline]||""}

function dashboard(){
document.getElementById("app").innerHTML='<div class="dash-head"><h2>👋 Welcome to HomeBuy AI</h2><p>Your information is saved. Now let’s start making sense of your homebuying journey.</p></div>'+
'<div class="dash-grid">'+
dash("🧮","b","Can I Afford This Home?","See what a home could really cost each month, not just the mortgage payment.","Analyze affordability →","affordability()")+
dash("🏠","g","Find a Home","Search for homes that fit your financial comfort zone and priorities.","Explore homes →","coming('Find a Home')",true)+
dash("🤝","p","Find a Professional","Find lenders, agents, inspectors, insurance professionals, and more.","Find help →","coming('Find a Professional')",true)+
dash("💰","o","Find Homebuying Programs","Discover grants, assistance programs, veteran resources, and other opportunities.","Find programs →","coming('Homebuying Programs')",true)+
dash("🔍","y","Challenge My Decision","Thinking about buying a specific home? Let HomeBuy AI challenge the numbers.","Challenge this home →","challenge()")+
dash("🗺️","p","My Homebuying Plan","Build a personalized roadmap from where you are today to closing day.","View my plan →","coming('My Homebuying Plan')",true)+
'</div><div style="text-align:center;margin-top:22px"><button class="btn secondary" onclick="startOver()">🔄 Start Over</button></div>';
}
function dash(icon,cls,title,text,link,fn,soon){return '<div class="dash-card '+(soon?"coming":"")+'" onclick="'+fn+'">'+(soon?'<div class="badge">COMING SOON</div>':"")+'<div class="dash-icon '+cls+'">'+icon+'</div><h3>'+title+'</h3><p>'+text+'</p><div class="link">'+link+'</div></div>'}
function coming(x){alert(x+" is part of the HomeBuy AI roadmap and will be coming soon.")}

function affordability(){
var income=Number(A.income||0),debt=Number(A.debt||0),monthly=income/12,housing=monthly*.28,price=A.targetPrice?Number(A.targetPrice):housing*12*4.5;
var risk=A.emergencySavings==="under5"?"🟡 Needs Attention":"🟢 Comfortable",cls=A.emergencySavings==="under5"?"yellow":"green";
document.getElementById("app").innerHTML='<div class="title"><div class="step">🧮 AFFORDABILITY</div><h2>Let’s look beyond the mortgage</h2><p>This is an early planning estimate. It is not a loan approval.</p></div><div class="card afford"><div class="center muted">🎯 ESTIMATED HOME PRICE TO EXPLORE</div><div class="big center">$'+Math.round(price).toLocaleString()+'</div><div class="center muted">HomeBuy AI planning estimate</div><div class="metrics">'+
metric("Monthly income","$"+Math.round(monthly).toLocaleString())+metric("Monthly debt","$"+debt.toLocaleString())+metric("Housing estimate","$"+Math.round(housing).toLocaleString())+
'</div><div class="risk '+cls+'">'+risk+'</div><div class="ai"><strong>🤖 HomeBuy AI says</strong><p>The goal isn’t to find the biggest home you might qualify for. The goal is to find a home you can actually enjoy living in without constantly worrying about the payment.</p><p>As HomeBuy AI develops, this section will include taxes, insurance, HOA fees, maintenance, utilities, debt, cash reserves, loan details, and other costs.</p></div></div><div class="nav"><button class="btn secondary" onclick="dashboard()">← Dashboard</button><button class="btn primary" onclick="challenge()">🔍 Challenge a Home →</button></div>';
}
function metric(a,b){return '<div class="metric"><small>'+a+'</small><strong>'+b+'</strong></div>'}

function challenge(){
document.getElementById("app").innerHTML='<div class="title"><div class="step">🔍 CHALLENGE MY DECISION</div><h2>Have a home in mind?</h2><p>Enter the price and we’ll help you think through the financial impact.</p></div><div class="card form"><div class="input-group"><label>🏠 Home purchase price</label><input id="challengePrice" type="number" min="0" placeholder="Example: 300000"></div><button class="btn primary" style="width:100%" onclick="analyze()">🤖 Analyze This Home</button></div><div class="nav"><button class="btn secondary" onclick="dashboard()">← Dashboard</button></div>';
}
function analyze(){
var price=Number(document.getElementById("challengePrice").value);if(!price)return alert("Please enter a valid home price.");
var mortgage=price*.005,tax=price*.0012,ins=price*.00035,maint=price*.00083,utilities=250,total=mortgage+tax+ins+maint+utilities;
var risk=A.emergencySavings==="under5"?"🟡 This May Be a Stretch":"🟢 Looks Reasonable",cls=A.emergencySavings==="under5"?"yellow":"green";
document.getElementById("app").innerHTML='<div class="title"><div class="step">🤖 HOME ANALYSIS</div><h2>Here’s what we found</h2><p>Purchase price is only one part of owning a home.</p></div><div class="card afford"><div class="center muted">🏠 HOME PRICE</div><div class="big center">$'+price.toLocaleString()+'</div><div class="metrics">'+metric("Mortgage estimate","$"+Math.round(mortgage).toLocaleString())+metric("Taxes","$"+Math.round(tax).toLocaleString())+metric("Insurance","$"+Math.round(ins).toLocaleString())+metric("Maintenance","$"+Math.round(maint).toLocaleString())+metric("Utilities","$250")+metric("Estimated monthly total","$"+Math.round(total).toLocaleString())+'</div><div class="risk '+cls+'">'+risk+'</div><div class="ai"><strong>🔥 Challenge the purchase</strong><p>Can you comfortably handle the payment, taxes, insurance, maintenance, utilities, and unexpected repairs while still having money left for the rest of your life?</p><p>You can still choose to pursue this home. Our job is to make sure you understand the financial tradeoff before you do.</p></div></div><div class="nav"><button class="btn secondary" onclick="dashboard()">← Dashboard</button><button class="btn primary" onclick="challenge()">🔄 Analyze Another Home</button></div>';
}

function startOver(){if(!confirm("Are you sure you want to start over? Your saved answers will be cleared."))return;localStorage.removeItem("homebuyAIAnswers");A={homeStatus:"",military:"",militaryStatus:"",state:"",location:"",loanType:"",income:"",debt:"",savings:"",downPayment:"",creditScore:"",comfortablePayment:"",emergencySavings:"",propertyType:"",purchasePurpose:"",timeline:"",targetPrice:"",priorities:[]};welcome()}
welcome();
</script>
</body>
</html>
