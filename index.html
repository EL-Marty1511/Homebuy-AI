<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeBuy AI | Your Homebuying Advisor</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--purple:#7c3aed;--green:#16a34a;
  --orange:#f97316;--yellow:#eab308;--red:#dc2626;--dark:#172033;
  --text:#334155;--muted:#64748b;--border:#e2e8f0;--bg:#f6f8fc;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);
background:radial-gradient(circle at 0 0,#eaf2ff,transparent 34%),radial-gradient(circle at 100% 0,#f4edff,transparent 30%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border)}
.header-inner{max-width:980px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo-area{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:25px;color:white}
.logo-text h1{margin:0;color:var(--dark);font-size:19px}.logo-text p{margin:3px 0 0;color:var(--muted);font-size:12px}
.ai-badge{background:#f5f3ff;color:var(--purple);padding:8px 13px;border-radius:30px;font-size:12px;font-weight:bold}
.main{max-width:900px;margin:auto;padding:28px 18px 70px}
.progress{margin-bottom:25px}.progress-info{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:bold;margin-bottom:8px}
.progress-bar{height:8px;background:#e5eaf2;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}
.card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
.welcome{text-align:center;padding:44px 24px}.house{font-size:68px}.welcome h2{font-size:42px;margin:5px 0;color:var(--dark)}.gradient{background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-description{max-width:650px;margin:15px auto;line-height:1.7;color:var(--muted)}
.trust{max-width:700px;margin:25px auto;padding:20px;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);text-align:left;line-height:1.6;font-size:14px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.feature{padding:18px 12px;border:1px solid var(--border);border-radius:18px}.feature-icon{font-size:28px}.feature strong{display:block;margin-top:7px;color:var(--dark)}.feature span{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:bold;font-size:15px}.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;box-shadow:0 8px 20px rgba(37,99,235,.2)}.secondary{background:#fff;color:var(--text);border:2px solid var(--border)}
.title{margin-bottom:22px}.step{display:inline-block;background:#eff6ff;color:var(--blue);border-radius:30px;padding:7px 12px;font-size:12px;font-weight:bold;margin-bottom:10px}.title h2{margin:0;color:var(--dark);font-size:34px}.title p{color:var(--muted);line-height:1.6;margin-top:8px}
.form{padding:24px}.section{margin-bottom:24px}.section:last-child{margin-bottom:0}.section-title{font-weight:bold;color:var(--dark);margin-bottom:12px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{border:2px solid var(--border);background:#fff;border-radius:18px;padding:18px;text-align:left;min-height:92px;transition:.18s}.option:hover{border-color:#93c5fd;transform:translateY(-2px)}.option.selected{border-color:var(--blue);background:#eff6ff}.icon{font-size:28px;margin-bottom:7px}.option strong{display:block;color:var(--dark)}.desc{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:5px}
label{display:block;font-weight:bold;color:var(--dark);margin-bottom:9px}input,select{width:100%;padding:15px;border:2px solid var(--border);border-radius:14px;background:white;color:var(--dark);outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.07)}.help{font-size:12px;color:var(--muted);margin-top:6px}.input-group{margin-bottom:22px}
.info{background:#fff7ed;border:1px solid #fed7aa;padding:17px;border-radius:17px;font-size:13px;line-height:1.6}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
.review{margin-bottom:14px;overflow:hidden}.review-head{padding:15px 18px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center}.review-head strong{color:var(--dark)}.edit{border:0;background:#eff6ff;color:var(--blue);padding:7px 10px;border-radius:8px;font-weight:bold}.review-body{padding:17px 18px}.row{display:flex;justify-content:space-between;gap:20px;padding:6px 0}.row span{color:var(--muted)}.row strong{color:var(--dark);text-align:right}
.dash-head{background:linear-gradient(135deg,#172033,#334c7a);color:#fff;padding:30px;border-radius:25px;margin-bottom:18px}.dash-head h2{margin:0;font-size:31px}.dash-head p{color:#dbe5f4;line-height:1.6;max-width:650px}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.dash-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;transition:.18s;position:relative}.dash-card:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(15,23,42,.1)}.dash-icon{width:55px;height:55px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px}.b{background:#eff6ff}.g{background:#f0fdf4}.p{background:#f5f3ff}.o{background:#fff7ed}.y{background:#fefce8}.dash-card h3{margin:0;color:var(--dark)}.dash-card p{color:var(--muted);font-size:13px;line-height:1.6}.link{color:var(--blue);font-weight:bold;font-size:13px}.coming{opacity:.72}.badge{position:absolute;right:15px;top:15px;background:#f1f5f9;color:var(--muted);padding:6px 8px;border-radius:20px;font-size:9px;font-weight:bold}
.afford{padding:28px}.center{text-align:center}.big{font-size:54px;font-weight:900;color:var(--dark);margin:8px 0}.muted{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.metric{background:#f8fafc;border-radius:16px;padding:15px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;margin-top:6px;color:var(--dark)}.ai{background:linear-gradient(135deg,#f5f3ff,#eff6ff);border:1px solid #ddd6fe;border-radius:18px;padding:20px;margin-top:20px;line-height:1.6}.ai strong{color:var(--purple)}.risk{text-align:center;padding:17px;border-radius:17px;margin-top:20px;font-weight:bold}.green{background:#f0fdf4;color:var(--green)}.yellow{background:#fefce8;color:#a16207}.red{background:#fef2f2;color:var(--red)}.guidance-box{margin-top:14px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;line-height:1.6}.guidance-box>strong{color:var(--dark);font-size:15px}.guidance-box p{font-size:13px;color:var(--muted);margin:8px 0}.guidance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.guidance-grid>div{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px}.guidance-grid strong{display:block;color:var(--dark);font-size:13px}.guidance-grid span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}.guidance-close{border-top:1px solid var(--border);padding-top:12px;margin-top:14px!important}.guidance-close strong{color:var(--blue)}.guidance-card{margin-top:16px}.guidance-card .section{margin-bottom:0} .reason-box{margin:14px 0;padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px}.reason-box strong{color:var(--dark)}.reason-box ul{margin:9px 0 0 20px;padding:0}.reason-box li{margin:6px 0;color:var(--muted);line-height:1.45}.reason-box p{margin:8px 0 0;color:var(--muted);line-height:1.5}.guidance-step{border:2px solid #c7d2fe;background:linear-gradient(135deg,#eff6ff,#f5f3ff)}.learn-card{background:linear-gradient(135deg,#f8fafc,#f5f3ff);border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:10px}.learn-card strong{color:var(--dark)}.learn-card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.learn-card a{display:inline-block;margin-top:8px;color:var(--blue);font-weight:bold;font-size:13px;text-decoration:none}
@media(max-width:700px){.main{padding:18px 12px 50px}.ai-badge{display:none}.welcome{padding:35px 18px}.welcome h2{font-size:34px}.features,.options,.dash-grid,.metrics,.guidance-grid{grid-template-columns:1fr}.nav{flex-direction:column-reverse}.nav .btn{width:100%}.row{flex-direction:column;gap:3px}.row strong{text-align:left}.big{font-size:42px}}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div class="logo-area"><div class="logo">🏠</div><div class="logo-text"><h1>HomeBuy AI</h1><p>Your Homebuying Advisor</p></div></div>
<div class="ai-badge">🤖 AI Powered</div>
</div>
</header>
<main class="main"><div id="app"></div></main>

<script>
var A={
homeStatus:"",guidance:"",maritalStatus:"",military:"",militaryStatus:"",state:"",location:"",loanType:"",
income:"",debt:"",spouseInfo:"",spouseIncome:"",spouseDebt:"",spouseMilitary:"",spouseMilitaryStatus:"",spouseCreditScore:"",savings:"",downPayment:"",creditScore:"",comfortablePayment:"",
emergencySavings:"",propertyType:"",purchasePurpose:"",timeline:"",targetPrice:"",
priorities:[],homeAddress:"",listingUrl:"",propertyDescription:"",bedrooms:"",bathrooms:"",squareFeet:"",yearBuilt:"",propertyTaxes:"",hoa:"",propertyData:null,rentOutUnit:"",rentalUnits:"",rentalIncome:"",propertyLookupStatus:""
};

var states=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];

function save(){try{localStorage.setItem("homebuyAIAnswers",JSON.stringify(A))}catch(e){}}

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function progress(n){if(!n)return"";return '<div class="progress"><div class="progress-info"><span>Your Homebuying Journey</span><span>'+n+' of 10</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(n/10*100)+'%"></div></div></div>'}
function opt(icon,title,value,selected,fn,desc){return '<button type="button" class="option '+(selected?"selected":"")+'" onclick="'+fn+'"><div class="icon">'+icon+'</div><strong>'+title+'</strong>'+(desc?'<span class="desc">'+desc+'</span>':"")+'</button>'}

function welcome(){
document.getElementById("app").innerHTML=
'<div class="card welcome"><div class="house">🏡</div><h2>Welcome to <span class="gradient">HomeBuy AI</span></h2>'+
'<p class="welcome-description">Buying a home is one of the biggest financial decisions you will ever make. HomeBuy AI helps you understand the numbers before you make it.</p>'+
'<div class="trust"><strong>🤝 HomeBuy AI is here to help you get to the right professionals.</strong><br><br>'+
'HomeBuy AI does not replace your lender, real estate agent, inspector, insurance agent, title company, property manager, or other professionals involved in the homebuying process.<br><br>'+
'Instead, we help you understand when you may need them, what questions to ask, and eventually help you find professionals who can assist you.<br><br>'+
'<strong>AI helps you prepare. Professionals help you complete the process. You make the decision.</strong></div>'+
'<div class="features"><div class="feature"><div class="feature-icon">💰</div><strong>Know Your Numbers</strong><span>Understand what your home could really cost.</span></div>'+
'<div class="feature"><div class="feature-icon">🧠</div><strong>Make Better Decisions</strong><span>See financial tradeoffs before buying.</span></div>'+
'<div class="feature"><div class="feature-icon">🤝</div><strong>Find The Right Help</strong><span>Connect with professionals when you need them.</span></div></div>'+
'<button class="btn primary" onclick="guidanceStart()">🚀 Let’s Get Started</button></div>';
}

function guideStep(step,title,text,nextText){
if(A.guidance!=="yes")return "";
return '<div class="learn-card guidance-step"><strong>🧭 GUIDANCE MODE: '+title+'</strong><p>'+text+'</p>'+(nextText?'<p><strong>What happens next:</strong> '+nextText+'</p>':'')+'</div>';
}

function guidanceStart(){
document.getElementById("app").innerHTML=progress(1)+
'<div class="title"><div class="step">🧭 STEP 1</div><h2>Would you like HomeBuy AI to guide you?</h2><p>Buying a home can feel scary and overwhelming. You do not have to know everything before you begin.</p></div>'+
'<div class="card form"><div class="guidance-box" style="margin-top:0"><strong>🧭 Guidance is recommended for those who are first time home buyers.</strong><p>If you choose guidance, HomeBuy AI will explain each step, important terms, costs, and decisions as you move through the homebuying process.</p><div class="options">'+
opt("✅","Yes, Guide Me","yes",A.guidance==="yes","setGuidance('yes')","Help me understand the process every step of the way.")+
opt("➡️","No, I’m good for now","no",A.guidance==="no","setGuidance('no')","I’ll ask for help when I need it.")+
'</div>'+(A.guidance==="yes"?'<div class="guidance-box"><strong>🏡 You’re not expected to know all of this.</strong><p>We will explain things as they become relevant instead of overwhelming you with information all at once.</p><div class="guidance-grid"><div><strong>💰 Understand the costs</strong><span>We will explain payments, taxes, insurance, closing costs, and other expenses.</span></div><div><strong>🏠 Understand the home</strong><span>We will help you understand what you are looking at and what to consider.</span></div><div><strong>🤝 Know when you need help</strong><span>We will explain when a lender, agent, inspector, insurance professional, or other professional may be needed.</span></div><div><strong>🧠 Understand your decision</strong><span>We will show you the numbers and explain why a home may or may not fit your situation.</span></div></div><p class="guidance-close"><strong>Our goal is to help you feel informed, not overwhelmed.</strong></p></div>':"")+'</div></div>'+
'<div class="nav"><button class="btn secondary" onclick="welcome()">← Back</button><button class="btn primary" onclick="continueGuidance()">Continue →</button></div>';
}
function setGuidance(v){A.guidance=v;save();guidanceStart()}
function continueGuidance(){if(!A.guidance)return alert("Please choose whether you would like HomeBuy AI guidance.");about()}
function about(){
document.getElementById("app").innerHTML=progress(2)+
'<div class="title"><div class="step">👋 STEP 2</div><h2>Let’s start with one simple question</h2><p>You do not need to know anything about mortgages or the homebuying process yet.</p></div>'+ 
'<div class="card form"><div class="section"><div class="section-title">🏠 Have you owned a home before?</div><p class="help">This helps us understand where you are in your homebuying journey.</p><div class="options">'+
opt("🌱","I’m a first-time buyer","first",A.homeStatus==="first","setHome('first')","I’m purchasing my first home.")+ 
opt("🏡","Yes, I’ve owned a home","previous",A.homeStatus==="previous","setHome('previous')","I’ve owned a home before.")+ 
opt("🏘️","I own multiple properties","multiple",A.homeStatus==="multiple","setHome('multiple')","I’m looking at another property.")+
'</div></div></div>'+
'<div class="nav"><button class="btn secondary" onclick="guidanceStart()">← Back</button><button class="btn primary" onclick="continueHomeStatus()">Continue →</button></div>';
}
function setHome(v){A.homeStatus=v;save();about()}
function continueHomeStatus(){if(!A.homeStatus)return alert("Please select your homeownership status.");aboutDetails()}

function aboutDetails(){
document.getElementById("app").innerHTML=progress(3)+
'<div class="title"><div class="step">👋 STEP 3</div><h2>Tell us a little more about you</h2><p>This helps us understand what type of homebuying journey you are on.</p></div>'+guideStep(2,'Let’s understand your household','We ask about marital status and military service because buying with a spouse can change the household income and debt we use, and military service may open programs such as VA financing. You do not need to know what you qualify for yet.','Next, we will ask where you are looking, because location can change taxes, insurance, programs, and other costs.')+
'<div class="card form"><div class="section"><div class="section-title">💍 What is your marital status?</div><div class="options">'+
opt("👤","Single","single",A.maritalStatus==="single","setMarital('single')","Buying on your own or as a single household.")+ 
opt("💑","Married","married",A.maritalStatus==="married","setMarital('married')","You may choose to include your spouse’s information.")+ 
'</div></div>'+ 
(A.maritalStatus==="married"?'<div class="section"><div class="info"><strong>💑 Married? You can include your spouse if you want.</strong><br>This is optional. Adding your spouse’s information can help HomeBuy AI make a more complete household affordability estimate. You can skip this and continue with only your information.</div><div class="options" style="margin-top:12px">'+
opt("➕","Yes, include my spouse","yes",A.spouseInfo==="yes","setSpouseInfo('yes')","Add spouse income, debt, credit, and military information.")+
opt("➡️","No, continue without spouse info","no",A.spouseInfo!=="yes","setSpouseInfo('no')","I’ll continue with my information only.")+ 
'</div>'+(A.spouseInfo==="yes"?'<div class="card form" style="margin-top:16px;border:1px solid var(--border);box-shadow:none"><div class="section-title">👥 Your Spouse’s Information</div><p class="help">Only enter what you want to share. These answers are used to improve the household estimate.</p><div class="input-group"><label>💰 Spouse’s annual gross income</label><input type="number" min="0" value="'+esc(A.spouseIncome)+'" placeholder="Example: 65000" oninput="A.spouseIncome=this.value;save()"><div class="help">Enter your spouse’s annual income before taxes.</div></div><div class="input-group"><label>💳 Spouse’s monthly debt payments</label><input type="number" min="0" value="'+esc(A.spouseDebt)+'" placeholder="Example: 500" oninput="A.spouseDebt=this.value;save()"><div class="help">Car payments, student loans, credit cards, and other recurring debt.</div></div><div class="section"><div class="section-title">🪖 Has your spouse served in the military?</div><div class="options">'+
opt("✅ 🫡","Yes","yes",A.spouseMilitary==="yes","setSpouseMilitary('yes')","We’ll include military related pathways when appropriate.")+
opt("❌","No","no",A.spouseMilitary==="no","setSpouseMilitary('no')","No military pathway needed for your spouse.")+
'</div></div>'+(A.spouseMilitary==="yes"?'<div class="section"><div class="section-title">🎖️ What is your spouse’s military status?</div><div class="options">'+
opt("🪖","Active Duty","active",A.spouseMilitaryStatus==="active","setSpouseMilStatus('active')")+
opt("⭐","Reserve","reserve",A.spouseMilitaryStatus==="reserve","setSpouseMilStatus('reserve')")+
opt("⭐","National Guard","guard",A.spouseMilitaryStatus==="guard","setSpouseMilStatus('guard')")+
opt("🎖️","Veteran","veteran",A.spouseMilitaryStatus==="veteran","setSpouseMilStatus('veteran')")+
opt("🏅","Retired Military","retired",A.spouseMilitaryStatus==="retired","setSpouseMilStatus('retired')")+
'</div></div>':"")+ '<div class="section"><div class="section-title">📊 Spouse’s approximate credit score</div><div class="options">'+
opt("⭐","760+","760",A.spouseCreditScore==="760","setSpouseCredit('760')")+opt("⭐","740 to 759","740",A.spouseCreditScore==="740","setSpouseCredit('740')")+opt("👍","700 to 739","700",A.spouseCreditScore==="700","setSpouseCredit('700')")+opt("👍","660 to 699","660",A.spouseCreditScore==="660","setSpouseCredit('660')")+opt("📈","620 to 659","620",A.spouseCreditScore==="620","setSpouseCredit('620')")+opt("⚠️","Below 620","below620",A.spouseCreditScore==="below620","setSpouseCredit('below620')")+opt("🤔","I don’t know","unknown",A.spouseCreditScore==="unknown","setSpouseCredit('unknown')")+
'</div></div></div>':"")+'</div>':"")+ 
'<div class="section"><div class="section-title">Have you served in the military?</div><div class="options">'+
opt("✅ 🫡","Yes","yes",A.military==="yes","setMilitary('yes')","We’ll show military related pathways.")+ 
opt("❌","No","no",A.military==="no","setMilitary('no')","We’ll show other pathways.")+ 
'</div></div>'+ 
(A.military==="yes"?'<div class="section"><div class="section-title">🎖️ What is your military status?</div><div class="options">'+
opt("🪖","Active Duty","active",A.militaryStatus==="active","setMilStatus('active')")+
opt("⭐","Reserve","reserve",A.militaryStatus==="reserve","setMilStatus('reserve')")+
opt("⭐","National Guard","guard",A.militaryStatus==="guard","setMilStatus('guard')")+
opt("🎖️","Veteran","veteran",A.militaryStatus==="veteran","setMilStatus('veteran')")+
opt("🏅","Retired Military","retired",A.militaryStatus==="retired","setMilStatus('retired')")+
'</div></div>':"")+ 
'</div><div class="nav"><button class="btn secondary" onclick="about()">← Back</button><button class="btn primary" onclick="continueAbout()">Continue →</button></div>';
}
function setMarital(v){A.maritalStatus=v;if(v!=="married"){A.spouseInfo="no";A.spouseIncome="";A.spouseDebt="";A.spouseMilitary="";A.spouseMilitaryStatus="";A.spouseCreditScore="";if(A.military!=="yes"&&A.loanType==="VA")A.loanType=""}save();aboutDetails()}
function setSpouseInfo(v){A.spouseInfo=v;if(v!=="yes"){A.spouseIncome="";A.spouseDebt="";A.spouseMilitary="";A.spouseMilitaryStatus="";A.spouseCreditScore=""}save();aboutDetails()}
function setSpouseMilitary(v){A.spouseMilitary=v;if(v==="no")A.spouseMilitaryStatus="";save();aboutDetails()}
function setSpouseMilStatus(v){A.spouseMilitaryStatus=v;save();aboutDetails()}
function setSpouseCredit(v){A.spouseCreditScore=v;save();aboutDetails()}
function setMilitary(v){A.military=v;if(v==="no"){A.militaryStatus="";if(!spouseCanUseVA()&&A.loanType==="VA")A.loanType=""}save();aboutDetails()}
function setMilStatus(v){A.militaryStatus=v;save();aboutDetails()}
function spouseCanUseVA(){return A.maritalStatus==="married"&&A.spouseInfo==="yes"&&A.spouseMilitary==="yes"}
function householdMilitary(){return A.military==="yes"||spouseCanUseVA()}
function continueAbout(){if(!A.maritalStatus)return alert("Please select whether you are single or married.");if(!A.military&&!spouseCanUseVA())return alert("Please select whether you have served in the military.");if(A.military==="yes"&&!A.militaryStatus)return alert("Please select your military status.");if(A.maritalStatus==="married"&&A.spouseInfo==="yes"&&A.spouseMilitary==="yes"&&!A.spouseMilitaryStatus)return alert("Please select your spouse’s military status.");locationScreen()}

function locationScreen(){
var o='<option value="">Select your state</option>';states.forEach(function(s){o+='<option value="'+esc(s)+'" '+(A.state===s?"selected":"")+'>'+esc(s)+'</option>'});
document.getElementById("app").innerHTML=progress(4)+'<div class="title"><div class="step">📍 STEP 4</div><h2>Where are you buying?</h2><p>Location can affect taxes, insurance, programs, and the true cost of owning a home.</p></div>'+guideStep(3,'Why location matters','Your state and area can affect property taxes, homeowners insurance, down payment assistance, and other homebuying programs. If you only know the city or ZIP code, that is enough for now.','Next, we will talk about financing. If you do not know which loan you want, choose “I’m Not Sure.”')+
'<div class="card form"><div class="input-group"><label>🇺🇸 What state are you looking in?</label><select onchange="setState(this.value)">'+o+'</select></div>'+
'<div class="input-group"><label>📍 City, County, or ZIP</label><input type="text" value="'+esc(A.location)+'" placeholder="Example: Waukegan or 60085" oninput="setLocation(this.value)"></div>'+
(A.state?'<div class="info"><strong>💡 Why do we ask for your state?</strong><br>Your state may offer benefits, grants, tax programs, down payment assistance, or other resources that could help during the homebuying process.</div>':"")+
'</div><div class="nav"><button class="btn secondary" onclick="aboutDetails()">← Back</button><button class="btn primary" onclick="continueLocation()">Continue →</button></div>';
}
function setState(v){A.state=v;save();locationScreen()}function setLocation(v){A.location=v;save()}
function continueLocation(){if(!A.state)return alert("Please select your state.");if(!A.location.trim())return alert("Please enter a city, county, or ZIP.");loanScreen()}

function loanScreen(){
var h="";
if(householdMilitary())h+=opt("🪖","VA Loan","VA",A.loanType==="VA","setLoan('VA')","For eligible veterans and service members.");
h+=opt("🏦","FHA Loan","FHA",A.loanType==="FHA","setLoan('FHA')","A common option with lower down payment requirements.");
h+=opt("🏠","Conventional Loan","Conventional",A.loanType==="Conventional","setLoan('Conventional')","A common home loan offered by private lenders.");
h+=opt("🌾","USDA Loan","USDA",A.loanType==="USDA","setLoan('USDA')","May be available for eligible properties.");
h+=opt("💵","Cash","Cash",A.loanType==="Cash","setLoan('Cash')","Purchasing without a mortgage.");
h+=opt("🤔","I’m Not Sure","Not Sure",A.loanType==="Not Sure","setLoan('Not Sure')","That’s okay. We’ll help you understand your options.");
document.getElementById("app").innerHTML=progress(5)+'<div class="title"><div class="step">💳 STEP 5</div><h2>How are you buying?</h2><p>Don’t worry if you don’t know yet. Choosing “I’m Not Sure” is completely okay.</p></div>'+guideStep(4,'You do not need to know your loan yet','A lender will help determine which loan programs you may qualify for. We ask this so our planning math can use a reasonable starting point. “I’m Not Sure” is completely fine.','Next, we will ask about household income and monthly debt.')+'<div class="options">'+h+'</div><div class="nav"><button class="btn secondary" onclick="locationScreen()">← Back</button><button class="btn primary" onclick="continueLoan()">Continue →</button></div>';
}
function setLoan(v){A.loanType=v;save();loanScreen()}function continueLoan(){if(A.loanType==="VA"&&!householdMilitary())return alert("A VA loan is only shown when you or an included spouse has indicated military service.");if(!A.loanType)return alert("Please select a loan option.");incomeScreen()}

function incomeScreen(){
document.getElementById("app").innerHTML=progress(6)+'<div class="title"><div class="step">💼 STEP 6</div><h2>Let’s talk about income</h2><p>This helps HomeBuy AI understand what monthly payment may fit your lifestyle.</p></div>'+guideStep(5,'Why we ask about income and debt','Income tells us what money comes into the household. Debt tells us how much of that income is already committed each month. If you included your spouse, their income and debt are included in the household picture.','Next, we will look at savings and the money you may have available for the purchase.')+
'<div class="card form"><div class="input-group"><label>💰 Your annual gross income</label><input type="number" min="0" value="'+esc(A.income)+'" placeholder="Example: 85000" oninput="A.income=this.value;save()"><div class="help">Enter your annual income before taxes. If you chose to include your spouse, their income will be added automatically.</div></div>'+
'<div class="input-group"><label>💳 Monthly debt payments</label><input type="number" min="0" value="'+esc(A.debt)+'" placeholder="Example: 800" oninput="A.debt=this.value;save()"><div class="help">Include car payments, student loans, credit cards, and other recurring debt.</div></div></div>'+

function continueIncome(){if(!A.income)return alert("Please enter your annual gross income.");if(A.debt==="")return alert("Please enter your monthly debt payments. Enter 0 if you have none.");moneyScreen()}

function vaLandGuidance(){

var build=A.purchasePurpose==="build";
return '<div class="info" style="margin:16px 0;border:1px solid #bfdbfe;background:#eff6ff"><strong>🪖 VA Loan + Land: Important to know</strong><br>'+(build?'A VA-backed construction loan may be able to finance the land as part of an eligible transaction to build your home. A VA loan is not simply a loan to buy vacant land now and build later.':'A standard VA-backed purchase loan is not for buying vacant land by itself. If you plan to build a home, a qualifying VA construction loan may be an option when the land purchase is part of the eligible construction transaction.')+'<br><span class="help">VA purchase loans are generally for a home you will occupy, and specific eligibility and lender requirements apply. HomeBuy AI is providing guidance, not a loan approval.</span><br><a href="https://www.va.gov/housing-assistance/home-loans/loan-types/purchase-loan/" target="_blank" rel="noopener" style="color:var(--blue);font-weight:bold">🇺🇸 Learn about VA purchase loans →</a></div>';
}

function renderPrototypeAddressSuggestions(){
var box=document.getElementById("prototypeAddressSuggestions");if(!box)return;
var homes=PROTOTYPE_HOMES.filter(function(h){return !A.propertyType||h.type===A.propertyType;});
if(!homes.length){box.innerHTML="";return;}
box.innerHTML='<div class="info" style="margin-top:10px"><strong>🔎 Try a '+esc(typeLabel(A.propertyType))+' prototype home</strong><div class="help" style="margin:5px 0 10px">These sample addresses are available for testing. Click an address to place it in the search box.</div><div style="display:grid;gap:7px">'+homes.map(function(h){return '<button type="button" class="btn secondary" style="text-align:left;padding:10px 12px" onclick="usePrototypeAddress('+JSON.stringify(h.address)+')">📍 '+esc(h.address)+'</button>';}).join('')+'</div></div>';
}
function usePrototypeAddress(address){A.homeAddress=address;save();homeScreen();setTimeout(function(){searchAndReadHome()},0);}

function multiUnitSection(){

html+='<div class="section"><div class="section-title">🏘️ Multi Unit Rental Plan</div><p class="help">Because this is a multi family home, we want to understand whether another unit could produce potential rental income. This is a projection, not guaranteed rent.</p><div class="options">'+opt("🏠","Yes, I plan to rent out a unit","yes",A.rentOutUnit==="yes","setRentPlan('yes')")+opt("🏡","No, I will not rent a unit","no",A.rentOutUnit==="no","setRentPlan('no')")+'</div>'+(A.rentOutUnit==="yes"?'<div style="margin-top:12px"><label>How many units do you expect to rent?</label><input id="rentalUnits" type="number" min="1" step="1" value="'+esc(A.rentalUnits)+'" placeholder="Example: 1" oninput="A.rentalUnits=this.value;save()"><div style="height:10px"></div><label>Projected total rent per month</label><input id="rentalIncome" type="number" min="0" step="50" value="'+esc(A.rentalIncome)+'" placeholder="Example: 1500" oninput="A.rentalIncome=this.value;save()"><div class="help">Use a conservative estimate if you are not sure. HomeBuy AI treats this as potential income, not guaranteed income.</div></div>':"")+'</div>';
}

html+='<div class="section"><div class="section-title">💰 Investment Property Rental Projection</div><p class="help">Since you selected an investment property, we can include your projected monthly rent in the analysis. This is a planning estimate, not guaranteed income.</p><div class="input-group"><label>Projected monthly rent <span style="font-weight:normal">(optional)</span></label><input id="investmentRentalIncome" type="number" min="0" step="50" value="'+esc(A.rentalIncome)+'" placeholder="Example: 2000" oninput="A.rentalIncome=this.value;save()"><div class="help">Enter what you realistically think the property could rent for each month.</div></div></div>';

}
return html;
}
function setRentPlan(v){A.rentOutUnit=v;if(v!=="yes"){A.rentalUnits="";if(A.purchasePurpose!=="investment")A.rentalIncome=""}save();homeScreen()}

<script>
function toggleAIChat() {
  const chat = document.getElementById("aiChat");
  chat.classList.toggle("open");

  if (chat.classList.contains("open")) {
    setTimeout(() => {
      document.getElementById("aiInput").focus();
    }, 100);
  }
}

function addAIMessage(text, type) {
  const messages = document.getElementById("aiMessages");

  const message = document.createElement("div");
  message.className = "ai-message " + type;
  message.textContent = text;

  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;
}

async function sendAIMessage() {
  const input = document.getElementById("aiInput");
  const message = input.value.trim();

  if (!message) return;

  addAIMessage(message, "user");
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "ai-message ai";
  loading.textContent = "Thinking...";
  loading.id = "aiThinking";

  document.getElementById("aiMessages").appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    document.getElementById("aiThinking")?.remove();

    if (!response.ok) {
      addAIMessage(
        data.error || "I'm having trouble connecting right now.",
        "ai"
      );
      return;
    }

    addAIMessage(
      data.reply || "I wasn't able to generate a response.",
      "ai"
    );

  } catch (error) {
    document.getElementById("aiThinking")?.remove();

    addAIMessage(
      "I couldn't connect to the HomeBuy AI service. Please try again.",
      "ai"
    );
  }
}
