/* =========================================================
   HOMEBUY AI
   COMPLETE WEBSITE STYLES
========================================================= */

:root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-light: #eff6ff;

    --purple: #7c3aed;
    --purple-light: #f5f3ff;

    --green: #16a34a;
    --green-light: #f0fdf4;

    --orange: #f97316;
    --orange-light: #fff7ed;

    --yellow: #eab308;
    --yellow-light: #fefce8;

    --red: #dc2626;
    --red-light: #fef2f2;

    --dark: #172033;
    --text: #334155;
    --muted: #64748b;

    --border: #e2e8f0;
    --background: #f6f8fc;
    --white: #ffffff;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at top left,
            #eaf2ff,
            transparent 35%
        ),
        radial-gradient(
            circle at top right,
            #f4edff,
            transparent 30%
        ),
        var(--background);

    min-height: 100vh;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(255,255,255,0.96);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(10px);
}

.header-inner {
    max-width: 1000px;
    margin: auto;

    padding: 14px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    color: white;

    box-shadow:
        0 8px 18px rgba(37,99,235,0.25);
}

.logo-text h1 {
    margin: 0;

    color: var(--dark);

    font-size: 19px;
}

.logo-text p {
    margin: 3px 0 0;

    color: var(--muted);

    font-size: 12px;
}

.ai-badge {
    background: var(--purple-light);

    color: var(--purple);

    padding: 8px 13px;

    border-radius: 30px;

    font-size: 12px;

    font-weight: bold;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    max-width: 900px;

    margin: auto;

    padding:
        28px
        18px
        80px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress {
    margin-bottom: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;

    color: var(--muted);

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 8px;
}

.progress-bar {
    height: 8px;

    background: #e5eaf2;

    border-radius: 20px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

    border-radius: 20px;

    transition: width 0.3s ease;
}


/* =========================================================
   CARDS
========================================================= */

.card {
    background: var(--white);

    border: 1px solid var(--border);

    border-radius: 24px;

    box-shadow:
        0 10px 30px rgba(15,23,42,0.07);
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {
    text-align: center;

    padding:
        48px
        25px;

    overflow: hidden;
}

.house {
    font-size: 72px;

    margin-bottom: 10px;

    animation:
        floatHouse 3s ease-in-out infinite;
}

@keyframes floatHouse {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

    100% {
        transform: translateY(0);
    }

}

.welcome h2 {
    margin: 0;

    color: var(--dark);

    font-size: 42px;
}

.gradient {
    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}

.welcome-description {
    max-width: 680px;

    margin:
        17px
        auto;

    color: var(--muted);

    line-height: 1.7;

    font-size: 16px;
}


/* =========================================================
   TRUST BOX
========================================================= */

.trust {
    max-width: 720px;

    margin:
        28px
        auto;

    padding: 21px;

    border-radius: 19px;

    background:
        linear-gradient(
            135deg,
            var(--blue-light),
            var(--purple-light)

    text-align: left;

    line-height: 1.65;

    font-size: 14px;

    border: 1px solid #dbeafe;
}


/* =========================================================
   FEATURE CARDS
========================================================= */

.features {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;

    margin:
        26px
        0;
}

.feature {
    padding: 19px 13px;

    border:
        1px solid var(--border);

    border-radius: 19px;

    background: white;

    transition: 0.2s;
}

.feature:hover {

    box-shadow:

}

.feature-icon {
    font-size: 30px;
}

.feature strong {
    display: block;

    margin-top: 8px;

    color: var(--dark);
}

.feature span {
    display: block;

    margin-top: 6px;

    font-size: 12px;

    color: var(--muted);

    line-height: 1.4;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: 0;

    border-radius: 14px;

    padding:
        14px
        22px;

    font-weight: bold;

    font-size: 15px;

    transition:
        0.2s;
}

.primary {
    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    color: white;

    box-shadow:
        0 8px 20px rgba(37,99,235,0.22);
}

.primary:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 25px rgba(37,99,235,0.30);
}

.secondary {
    background: white;

    color: var(--text);

    border:
        2px solid var(--border);
}

.secondary:hover {
    border-color: #bfdbfe;

    background: #f8fafc;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.title {
    margin-bottom: 23px;
}

.step {
    display: inline-block;

    background: var(--blue-light);

    color: var(--blue);

    border-radius: 30px;

    padding:
        7px
        12px;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 10px;
}

.title h2 {
    margin: 0;

    color: var(--dark);

    font-size: 34px;
}

.title p {
    color: var(--muted);

    line-height: 1.6;

    margin-top: 8px;
}


/* =========================================================
   FORM
========================================================= */

.form {
    padding: 25px;
}

.section {
    margin-bottom: 27px;
}

.section:last-child {
    margin-bottom: 0;
}

.section-title {
    color: var(--dark);

    font-weight: bold;

    margin-bottom: 12px;
}


/* =========================================================
   OPTIONS
========================================================= */

.options {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;
}

.option {
    border:
        2px solid var(--border);

    background: white;

    border-radius: 18px;

    padding: 18px;

    text-align: left;

    min-height: 92px;

    transition:
        0.2s;

    position: relative;
}

.option:hover {
    border-color: #93c5fd;

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px rgba(15,23,42,0.07);
}

.option.selected {
    border-color: var(--blue);

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f5f3ff
        );

    box-shadow:
        0 7px 18px rgba(37,99,235,0.10);
}

.icon {
    font-size: 28px;

    margin-bottom: 7px;
}

.option strong {
    display: block;

    color: var(--dark);
}

.desc {
    display: block;

    font-size: 12px;

    color: var(--muted);

    line-height: 1.4;

    margin-top: 5px;
}


/* =========================================================
   INPUTS
========================================================= */

label {
    display: block;

    color: var(--dark);

    font-weight: bold;

    margin-bottom: 9px;
}

input,
select {
    width: 100%;

    padding: 15px;

    border:
        2px solid var(--border);

    border-radius: 14px;

    background: white;

    color: var(--dark);

    outline: none;

    font-size: 15px;
}

input:focus,
select:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 4px rgba(37,99,235,0.07);
}

.input-group {
    margin-bottom: 23px;
}

.help {
    color: var(--muted);

    font-size: 12px;

    margin-top: 6px;

/* =========================================================

========================================================= */

.info {

    border:

    border-radius: 17px;

    font-size: 13px;

    line-height: 1.6;

/* =========================================================

========================================================= */

.nav {

    justify-content:

    gap: 12px;

    margin-top: 25px;

/* =========================================================

.review-body {

.row {

.row span {

.row strong {

.blue-bg {

.green-bg {

.purple-bg {

}

.orange-bg {
    background:
        var(--orange-light);
}

.yellow-bg {
    background:

.dash-card h3 {
    margin: 0;

}

.dash-card p {
    color: var(--muted);

}

.link {
    color: var(--blue);

    font-size: 13px;
}

.coming {

}

.badge {
    position: absolute;

    top: 15px;

    right: 15px;

    background:
        #f1f5f9;

    color: var(--muted);

    padding:
        6px
        8px;

    border-radius: 20px;

    font-size: 9px;

    font-weight: bold;
}


/* =========================================================
   AFFORDABILITY
========================================================= */

.afford {
    padding: 29px;
}

.center {
    text-align: center;
}

.big {
    font-size: 54px;

    font-weight: 900;

    color: var(--dark);

    margin:

        0;
}

.muted {
    color: var(--muted);

    font-size: 13px;
}

.metrics {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;

    margin-top: 24px;
}

.metric {
    background:
        #f8fafc;

    border-radius: 16px;

    padding: 15px;
}

.metric small {
    display: block;

    color: var(--muted);
}

.metric strong {
    display: block;

    margin-top: 6px;

    color: var(--dark);
}

.ai {
    background:
        linear-gradient(
            135deg,
            var(--purple-light),
            var(--blue-light)
        );

    border:
        1px solid #ddd6fe;

    border-radius: 18px;

    padding: 20px;

    margin-top: 20px;

    line-height: 1.6;
}

.ai strong {

}

.risk {

    padding: 17px;

    border-radius: 17px;

    margin-top: 20px;

}

.risk-green {
    background:
        var(--green-light);

    color:
        var(--green);
}

.risk-yellow {
    background:
        var(--yellow-light);

    color:
        #a16207;
}

.risk-red {
    background:
        var(--red-light);

    color:
        var(--red);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .main {

            12px

    .ai-badge {

    }

    .welcome {
        padding:
            35px
            18px;
    }

    .welcome h2 {

    .features {

    }

    }

    .row strong {
        text-align: left;
    }

    .big {
        font-size: 42px;
    }

}

</style>
</head>

/* =========================================================
   STORAGE
========================================================= */

function saveAnswers() {

    try {

        localStorage.setItem(
            "homebuyAIAnswers",
            JSON.stringify(answers)
        );

    } catch (error) {

        console.log("Storage unavailable.");

    }

}


function loadAnswers() {

    try {

        var saved =
            localStorage.getItem(
                "homebuyAIAnswers"
            );

        if (!saved) {
            return;
        }

        var parsed =
            JSON.parse(saved);

        Object.keys(answers).forEach(
            function(key) {

                if (
                    parsed[key] !== undefined
                ) {

                    answers[key] =
                        parsed[key];

                }

            }
        );

    } catch (error) {

        console.log(
            "Could not load saved answers."
        );

    }

}


loadAnswers();


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

========================================================= */

========================================================= */

    if (step === 0) {

        return "";

    }

    var percentage =
        Math.round(
            (step / 8) * 100
        );

    return `

        <div class="progress">

            <div class="progress-info">

                <span>
                    Your Homebuying Journey
                </span>

                <span>
                    ${step} of 8
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>

    `;

}

) {

            }

}

/* =========================================================
   ABOUT YOU FUNCTIONS
========================================================= */

function selectHomeStatus(value) {

    answers.homeStatus =
        value;

    saveAnswers();

    showAboutYou();

}


function selectMilitary(value) {

    answers.military =
        value;

    if (value === "no") {

        answers.militaryStatus =
            "";

        if (
            answers.loanType === "VA"
        ) {

            answers.loanType =
                "";

        }

    }

    saveAnswers();

    showAboutYou();

}


function selectMilitaryStatus(value) {

    answers.militaryStatus =
        value;

    saveAnswers();

    showAboutYou();

}


function continueAboutYou() {

    if (!answers.homeStatus) {

        alert(
            "Please select your homeownership status."
        );

        return;

    }


    if (!answers.military) {

        alert(
            "Please select whether you have served in the military."
        );

        return;

    }


    if (
        answers.military === "yes" &&
        !answers.militaryStatus
    ) {

        alert(
            "Please select your military status."
        );

        return;

    }


    showLocation();

}


/* =========================================================
   STEP 2
   LOCATION
========================================================= */

function showLocation() {

    var stateOptions =
        '<option value="">Select your state</option>';


    for (
        var i = 0;
        i < states.length;
        i++
    ) {

        stateOptions += `

            <option
                value="${escapeHTML(states[i])}"
                ${
                    answers.state === states[i]
                    ?
                    "selected"
                    :
                    ""
                }
            >
                ${escapeHTML(states[i])}
            </option>

        `;

    }


    app.innerHTML = `

        ${progress(2)}

        <div class="title">

            <div class="step">
                📍 STEP 2
            </div>

            <h2>
                Where are you buying?
            </h2>

            <p>
                Location can affect taxes,
                insurance, programs, and the true
                cost of owning a home.
            </p>

        </div>


        <div class="card form">


            <div class="input-group">

                <label>
                    🇺🇸 What state are you looking in?
                </label>

                <select
                    onchange="selectState(this.value)"
                >

                    ${stateOptions}

                </select>

            </div>


            <div class="input-group">

                <label>
                    📍 City, County, or ZIP
                </label>

                <input
                    type="text"
                    value="${escapeHTML(answers.location)}"
                    placeholder="Example: Waukegan or 60085"
                    oninput="updateLocation(this.value)"
                >

            </div>


            ${
                answers.state
                ?
                `

                    <div class="info">

                        <strong>
                            💡 Why do we ask for your state?
                        </strong>

                        <br>

                        Your state may offer benefits,
                        grants, tax programs, down payment
                        assistance, or other resources
                        that could help during the
                        homebuying process.

                    </div>

                `
                :
                ""
            }


        </div>


        <div class="nav">

            <button
                class="btn secondary"
                onclick="showAboutYou()"
            >
                ← Back
            </button>


            <button
                class="btn primary"
                onclick="continueLocation()"
            >
                Continue →
            </button>

        </div>

    `;

}


function selectState(value) {

    answers.state =
        value;

    saveAnswers();

    showLocation();

}


function updateLocation(value) {

    answers.location =
        value;

    saveAnswers();

}


function continueLocation() {

    if (!answers.state) {

        alert(
            "Please select your state."
        );

        return;

    }


    if (
        !answers.location.trim()
    ) {

        alert(
            "Please enter a city, county, or ZIP."
        );

        return;

    }


    showLoanType();

}


/* =========================================================
   STEP 3
   LOAN TYPE
========================================================= */

function showLoanType() {

    var html = "";


    if (
        answers.military === "yes"
    ) {

        html += option(
            "🪖",
            "VA Loan",
            "VA",
            answers.loanType === "VA",
            "selectLoan('VA')",
            "For eligible veterans and service members."
        );

    }


    html += option(
        "🏦",
        "FHA Loan",
        "FHA",
        answers.loanType === "FHA",
        "selectLoan('FHA')",
        "A common option with lower down payment requirements."
    );


    html += option(
        "🏠",
        "Conventional Loan",
        "Conventional",
        answers.loanType === "Conventional",
        "selectLoan('Conventional')",
        "A common home loan offered by private lenders."
    );


    html += option(
        "🌾",
        "USDA Loan",
        "USDA",
        answers.loanType === "USDA",
        "selectLoan('USDA')",
        "May be available for eligible properties."
    );


    html += option(
        "💵",
        "Cash",
        "Cash",
        answers.loanType === "Cash",
        "selectLoan('Cash')",
        "Purchasing without a mortgage."
    );


    html += option(
        "🤔",
        "I'm Not Sure",
        "Not Sure",
        answers.loanType === "Not Sure",
        "selectLoan('Not Sure')",
        "That's okay. We'll help you understand your options."
    );


    app.innerHTML = `

        ${progress(3)}

        <div class="title">

            <div class="step">
                💳 STEP 3
            </div>

            <h2>
                How are you buying?
            </h2>

            <p>
                Don't worry if you don't know yet.
                Choosing "I'm Not Sure" is completely okay.
            </p>

        </div>


        <div class="options">

            ${html}

        </div>


        <div class="nav">

            <button
                class="btn secondary"
                onclick="showLocation()"
            >
                ← Back
            </button>


            <button
                class="btn primary"
                onclick="continueLoanType()"
            >
                Continue →
            </button>

        </div>

    `;

}


function selectLoan(value) {

    if (
        value === "VA" &&
        answers.military !== "yes"
    ) {

        return;

    }


    answers.loanType =
        value;

    saveAnswers();

    showLoanType();

}


function continueLoanType() {

    if (!answers.loanType) {

        alert(
            "Please select a loan option."
        );

        return;

    }


    if (
        answers.loanType === "VA" &&
        answers.military !== "yes"
    ) {

        answers.loanType =
            "";

        saveAnswers();

        alert(
            "VA loans require military service to be selected."
        );

        return;

    }


    showIncome();

}

========================================================= */

function preserveTargetPrice() {

    var input =
        document.getElementById(
            "targetPrice"
        );

    if (input) {

        answers.targetPrice =
            input.value;

    }

}


function updateTargetPrice(value) {

    answers.targetPrice =
        value;

    saveAnswers();

}


function selectPropertyType(value) {

    preserveTargetPrice();

    answers.propertyType =
        value;

    saveAnswers();

    showHomePlan();

}


function selectPurpose(value) {

    preserveTargetPrice();

    answers.purchasePurpose =
        value;

    saveAnswers();

    showHomePlan();

}


function selectTimeline(value) {

    preserveTargetPrice();

    answers.timeline =
        value;

    saveAnswers();

    showHomePlan();

}


/* =========================================================
   PRIORITIES
========================================================= */

function priority(
    icon,
    title,
    value
) {

    var selected =
        answers.priorities.indexOf(
            value
        ) !== -1;


    return `

        <button
            type="button"
            class="option ${selected ? "selected" : ""}"
            onclick="togglePriority('${value}')"
        >

            <div class="icon">
                ${icon}
            </div>

            <strong>
                ${title}
            </strong>

        </button>

    `;

}


function togglePriority(value) {

    preserveTargetPrice();


    var index =
        answers.priorities.indexOf(
            value
        );


    if (index === -1) {

        answers.priorities.push(
            value
        );

    } else {

        answers.priorities.splice(
            index,
            1
        );

    }


    saveAnswers();

    showHomePlan();

}


function continueHomePlan() {

    preserveTargetPrice();

    saveAnswers();


    if (!answers.propertyType) {

        alert(
            "Please select a property type."
        );

        return;

    }


    if (!answers.purchasePurpose) {

        alert(
            "Please select what you plan to use the property for."
        );

        return;

    }


    if (!answers.timeline) {

        alert(
            "Please select your purchase timeline."
        );

        return;

    }


    if (
        answers.priorities.length === 0
    ) {

        alert(
            "Please select at least one priority."
        );

        return;

    }


    showReview();

}

/* =========================================================
   REVIEW CARD
========================================================= */

function reviewCard(
    title,
    rows,
    editFunction
) {

    var content = "";


    for (
        var i = 0;
        i < rows.length;
        i++
    ) {

        if (!rows[i][1]) {

            continue;

        }


        content += `

            <div class="row">

                <span>
                    ${escapeHTML(
                        rows[i][0]
                    )}
                </span>

                <strong>
                    ${escapeHTML(
                        rows[i][1]
                    )}
                </strong>

            </div>

        `;

    }


    return `

        <div class="card review">

            <div class="review-head">

                <strong>
                    ${title}
                </strong>


                <button
                    class="edit"
                    onclick="${editFunction}"
                >
                    ✏️ Edit
                </button>

            </div>


            <div class="review-body">

                ${content}

            </div>

        </div>

    `;

}
